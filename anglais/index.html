<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#17202f;--muted:#6b7486;--line:#dde2ec;--accent:#1f4e9a;--red:#b3122b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#161d28;--ink:#e8edf5;--muted:#8b97a9;--line:#2a3546;--accent:#7fb0ff;--red:#ff7a8c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{width:56px;height:56px;border-radius:14px;background:#1f4e9a;color:#fff;display:grid;place-items:center;font-weight:800;margin:0 auto 12px;font-size:1.1rem}
h1{font-size:1.3rem;text-align:center;margin:0 0 4px}p{color:var(--muted);text-align:center;margin:0 0 18px;font-size:.92rem}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.92rem;color:var(--muted)}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b1424}}
button:disabled{opacity:.6;cursor:wait}.err{color:var(--red);min-height:1.4em;text-align:center;margin:10px 0 0;font-size:.9rem}
</style>
</head>

    });
  }
  if (!subtle) { err("Ce navigateur ne permet pas le déchiffrement (HTTPS requis)."); return; }
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.salt === P.salt && saved.exp > Date.now()) {
      subtle.importKey("raw", b64(saved.k), { name: "AES-GCM" }, false, ["decrypt"]).then(open).catch(function(){ localStorage.removeItem(KEY); });
    }
  } catch (e) {}
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = document.getElementById("pw").value, btn = document.getElementById("go");
    if (!pw) return;
    btn.disabled = true; btn.textContent = "Déverrouillage…"; err("");
    derive(pw).then(function(key){
      return subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data)).then(function(){
        if (document.getElementById("rem").checked) {
          return subtle.exportKey("raw", key).then(function(raw){
            try { localStorage.setItem(KEY, JSON.stringify({ k: tob64(raw), salt: P.salt, exp: Date.now() + 30 * 864e5 })); } catch (x) {}
            return key;
          });
        }
        return key;
      });
    }).then(open).catch(function(){
      btn.disabled = false; btn.textContent = "Déverrouiller"; err("Mot de passe incorrect.");
    });
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
